table: bgp_processes
title: {ja: BGP, en: BGP}
since: M3
key: [device, vrf]
columns:
  - {name: device, title: {ja: 機器, en: Device}, type: ref, ref: devices.hostname, required: true, note: {ja: "ホスト名。* は全機器、@グループ名 はそのグループの機器", en: "Host name. * = every device, @group = the devices of the group"}}
  - {name: vrf, title: {ja: VRF, en: VRF}, type: ref, ref: vrfs.name, note: {ja: "空 = VRF なし（全体の経路表）", en: "Empty = no VRF (the global table)"}}
  - {name: asn, title: {ja: AS 番号, en: AS number}, type: int, required: true}
  - {name: router_id, title: {ja: ルータ ID, en: Router ID}, type: ip4, explicit: true}
  - {name: keepalive, title: {ja: Keepalive（秒）, en: Keepalive (s)}, type: int}
  - {name: holdtime, title: {ja: Hold（秒）, en: Hold time (s)}, type: int}
  - {name: log_neighbor_changes, title: {ja: ネイバーの変化を記録, en: Log neighbor changes}, type: bool}
  - {name: ipv6_networks, title: {ja: IPv6 の広告経路, en: IPv6 networks}, type: "list<net6>"}
  - {name: ipv6_redistribute, title: {ja: IPv6 の再配布, en: IPv6 redistribute}, type: "list<enum>", values: [connected, static, ospf]}
  - {name: distance_ebgp, title: {ja: 優先度（eBGP の経路）, en: Distance (eBGP)}, type: int, min: 1, max: 255, note: {ja: "空 = 機器の既定（20）。Cisco は 3 つを組で書く", en: "Empty = the default of the device (20). Cisco takes the three together"}}
  - {name: distance_ibgp, title: {ja: 優先度（iBGP の経路）, en: Distance (iBGP)}, type: int, min: 1, max: 255, note: {ja: "空 = 機器の既定（200）", en: "Empty = the default of the device (200)"}}
  - {name: distance_local, title: {ja: 優先度（自分で作った経路）, en: Distance (local)}, type: int, min: 1, max: 255, note: {ja: "空 = 機器の既定（200）。Cisco だけ", en: "Empty = the default of the device (200). Cisco only"}}
  - {name: default_local_preference, title: {ja: ローカルプリファレンスの既定値, en: Default local preference}, type: int, min: 0, note: {ja: "空 = 機器の既定（100）", en: "Empty = the default of the device (100)"}}
