table: ipsec_tunnels
title: {ja: IPsec, en: IPsec}
since: M4
key: [device, name]
columns:
  - {name: device, title: {ja: 機器, en: Device}, type: ref, ref: devices.hostname, required: true, note: {ja: "ホスト名。* は全機器、@グループ名 はそのグループの機器", en: "Host name. * = every device, @group = the devices of the group"}}
  - {name: name, title: {ja: 名前, en: Name}, type: string, required: true, auto_name: true, note: {ja: "取り込み時は、トンネル IF の名前か、マップの名前（Cisco は「マップ名/番号」）。比べるときは、名前でなく中身で行を合わせる", en: "The tunnel interface or the name of the map (\"map/number\" with Cisco) on import. Rows are matched by what they hold, not by this name"}}
  - {name: style, title: {ja: 方式, en: Style}, type: enum, values: [tunnel_if, policy], required: true, note: {ja: "tunnel_if = トンネル IF に経路を向ける。policy = 対象通信で選ぶ", en: "tunnel_if = routes point to a tunnel interface. policy = traffic is picked by selectors"}}
  - {name: tunnel_if, title: {ja: トンネル IF, en: Tunnel interface}, type: ifname, note: {ja: "方式が tunnel_if のとき必須", en: "Needed when the style is tunnel_if"}}
  - {name: local_if, title: {ja: 自分側 IF, en: Local interface}, type: ifname, note: {ja: "方式が policy のとき: IPsec を当てる IF。L2TP の受け口を守る行は、NEC IX では空（受け口のトンネル IF に当てる）", en: "With the style policy: the interface IPsec is put on. Empty on NEC IX for a row that protects the callers of L2TP (it is put on their tunnel interfaces)"}}
  - {name: local_address, title: {ja: 自分側アドレス, en: Local address}, type: ip4}
  - {name: peer_address, title: {ja: 相手アドレス, en: Peer address}, type: string, required: true, note: {ja: "アドレス。相手が動的なら any。名前（FQDN）で書いてもよい", en: "An address, any for a dynamic peer, or a name (FQDN)"}}
  - {name: ike_version, title: {ja: IKE の版, en: IKE version}, type: enum, values: ["1", "2"], required: true, explicit: true}
  - {name: ike_mode, title: {ja: IKE のモード, en: IKE mode}, type: enum, values: [main, aggressive], explicit: true, note: {ja: "版 1 のみ", en: "Version 1 only"}}
  - {name: local_id, title: {ja: 自分の ID, en: Local ID}, type: string, note: {ja: "種類:値 の形。種類は address・fqdn・email・keyid（例 fqdn:rt-a01.example.com）。空 = 自分のアドレス", en: "kind:value. The kinds are address, fqdn, email and keyid (e.g. fqdn:rt-a01.example.com). Empty = the own address"}}
  - {name: remote_id, title: {ja: 相手の ID, en: Remote ID}, type: string, note: {ja: "種類:値 の形（自分の ID と同じ）。空 = 相手のアドレス", en: "kind:value, as the local ID. Empty = the address of the peer"}}
  - {name: psk, title: {ja: 事前共有鍵, en: Pre-shared key}, type: secret, required: true}
  - {name: psk_remote, title: {ja: 相手を確かめる鍵, en: Key of the peer}, type: secret, note: {ja: "版 2 で、自分が名乗る鍵（事前共有鍵）と相手を確かめる鍵が別のとき。空 = 事前共有鍵と同じ", en: "Version 2, where the key of the peer is another than the own one. Empty = the pre-shared key"}}
  - {name: psk_form, title: {ja: 鍵の書き方, en: Form of the key}, type: enum, values: [text, hex], note: {ja: "hex = 16 進で書いた鍵。空 = text（文字）", en: "hex = the key is written in hexadecimal. Empty = text"}}
  - {name: ike_encryption, title: {ja: IKE 暗号, en: IKE encryption}, type: enum, values: [des, 3des, aes128, aes192, aes256, aes128gcm, aes256gcm, "null"], explicit: true, note: {ja: "版 1 では必須。版 2 で空なら、機器が持つ候補に任せる", en: "Needed for version 1. Empty with version 2 = left to what the device offers"}}
  - {name: ike_hash, title: {ja: IKE ハッシュ, en: IKE hash}, type: enum, values: [md5, sha1, sha256, sha384, sha512], explicit: true, note: {ja: "版 1 では必須。版 2 で空なら、機器が持つ候補に任せる", en: "Needed for version 1. Empty with version 2 = left to what the device offers"}}
  - {name: ike_dh, title: {ja: IKE DH グループ, en: IKE DH group}, type: enum, values: [dh1, dh2, dh5, dh14, dh15, dh16, dh19, dh20, dh21, dh24], explicit: true, note: {ja: "版 1 では必須。版 2 で空なら、機器が持つ候補に任せる", en: "Needed for version 1. Empty with version 2 = left to what the device offers"}}
  - {name: ike_prf, title: {ja: IKE PRF, en: IKE PRF}, type: enum, values: [md5, sha1, sha256, sha384, sha512], note: {ja: "版 2 のみ。空 = IKE ハッシュと同じ", en: "Version 2 only. Empty = as the IKE hash"}}
  - {name: ike_lifetime, title: {ja: IKE 有効時間（秒）, en: IKE lifetime (s)}, type: int, explicit: true}
  - {name: esp_encryption, title: {ja: ESP 暗号, en: ESP encryption}, type: enum, values: [des, 3des, aes128, aes192, aes256, aes128gcm, aes256gcm, "null"], explicit: true, note: {ja: "版 1 では必須。版 2 で空なら、機器が持つ候補に任せる", en: "Needed for version 1. Empty with version 2 = left to what the device offers"}}
  - {name: esp_hash, title: {ja: ESP ハッシュ, en: ESP hash}, type: enum, values: [md5, sha1, sha256, sha384, sha512, none], explicit: true, note: {ja: "none = ESP の認証を使わない。版 1 では必須。版 2 で空なら、機器が持つ候補に任せる", en: "Needed for version 1. Empty with version 2 = left to what the device offers"}}
  - {name: ah_hash, title: {ja: AH ハッシュ, en: AH hash}, type: enum, values: [md5, sha1, sha256, sha384, sha512], note: {ja: "AH（認証ヘッダ）も使うとき", en: "Where AH is used as well"}}
  - {name: ipsec_mode, title: {ja: IPsec のモード, en: IPsec mode}, type: enum, values: [tunnel, transport], note: {ja: "空 = tunnel", en: "Empty = tunnel"}}
  - {name: pfs, title: {ja: PFS, en: PFS}, type: enum, values: [none, dh1, dh2, dh5, dh14, dh15, dh16, dh19, dh20, dh21, dh24], explicit: true}
  - {name: ipsec_lifetime, title: {ja: IPsec 有効時間（秒）, en: IPsec lifetime (s)}, type: int, explicit: true}
  - {name: ipsec_lifetime_kb, title: {ja: IPsec 有効量（キロバイト）, en: IPsec lifetime (KB)}, type: int, note: {ja: "この量を送ったら鍵を替える", en: "The keys are renewed after this volume"}}
  - {name: always_on, title: {ja: いつもつないでおく, en: Always on}, type: bool, note: {ja: "通信が無くても、切れたらつなぎ直す。空 = 通信があったときにつなぐ", en: "Connects again when it is down, with or without traffic. Empty = connects on traffic"}}
  - {name: dpd_interval, title: {ja: 相手監視の間隔（秒）, en: DPD interval (s)}, type: int}
  - {name: dpd_retry, title: {ja: 相手監視の再送回数, en: DPD retries}, type: int}
  - {name: dpd_retry_interval, title: {ja: 相手監視の再送間隔（秒）, en: DPD retry interval (s)}, type: int, note: {ja: "返事が無いときに、聞き直す間隔", en: "How long to wait before asking again"}}
  - {name: dpd_mode, title: {ja: 相手監視の送り方, en: DPD mode}, type: enum, values: [on_demand, periodic], note: {ja: "on_demand = 通信が無いときだけ聞く。periodic = いつも間隔ごとに聞く", en: "on_demand = asks only when no traffic comes. periodic = asks at every interval"}}
  - {name: nat_traversal, title: {ja: NAT 越え, en: NAT traversal}, type: bool}
  - {name: nat_keepalive, title: {ja: NAT 越えの維持間隔（秒）, en: NAT keepalive (s)}, type: int}
  - {name: nat_force, title: {ja: NAT 越えを必ず使う, en: Force NAT traversal}, type: bool, note: {ja: "途中に NAT が無くても UDP で包む", en: "Wraps in UDP even where no NAT is on the way"}}
  - {name: ike_bind, title: {ja: この IKE の相手だけに使う, en: Bound to this IKE peer}, type: bool, note: {ja: "相手が any のとき、この行の IKE で確かめた相手だけを受け付ける（NEC IX の ike-binding）", en: "With the peer any: only a peer that this row's IKE setting has proved is let in (ike-binding of NEC IX)"}}
  - {name: ike_encryption_more, title: {ja: IKE 暗号（追加）, en: IKE encryption (more)}, type: "list<enum>", values: [3des, aes128, aes192, aes256, aes128gcm, aes256gcm], note: {ja: "版 2 のみ。同じ提案に並べる 2 つ目以降の値（機器は、並べた値のどの組み合わせでも折り合う）", en: "Version 2 only. Further values of the same proposal (the device agrees to any combination of the listed values)"}}
  - {name: ike_hash_more, title: {ja: IKE ハッシュ（追加）, en: IKE hash (more)}, type: "list<enum>", values: [md5, sha1, sha256, sha384, sha512], note: {ja: "版 2 のみ。同じ提案に並べる 2 つ目以降の値", en: "Version 2 only. Further values of the same proposal"}}
  - {name: ike_dh_more, title: {ja: IKE DH グループ（追加）, en: IKE DH group (more)}, type: "list<enum>", values: [dh1, dh2, dh5, dh14, dh15, dh16, dh19, dh20, dh21, dh24], note: {ja: "版 2 のみ。同じ提案に並べる 2 つ目以降の値", en: "Version 2 only. Further values of the same proposal"}}
  - {name: ike_prf_more, title: {ja: IKE PRF（追加）, en: IKE PRF (more)}, type: "list<enum>", values: [md5, sha1, sha256, sha384, sha512], note: {ja: "版 2 のみ。同じ提案に並べる 2 つ目以降の値", en: "Version 2 only. Further values of the same proposal"}}
  - {name: esp_encryption_more, title: {ja: ESP 暗号（追加）, en: ESP encryption (more)}, type: "list<enum>", values: [3des, aes128, aes192, aes256, aes128gcm, aes256gcm, "null"], note: {ja: "版 2 のみ。同じ提案に並べる 2 つ目以降の値（NEC IX の child-proposal。Cisco は、組み合わせごとのトランスフォームセットに置き換えて書く）", en: "Version 2 only. Further values of the same proposal (child-proposal of NEC IX; Cisco writes a transform set for each combination)"}}
  - {name: esp_hash_more, title: {ja: ESP ハッシュ（追加）, en: ESP hash (more)}, type: "list<enum>", values: [md5, sha1, sha256, sha384, sha512], note: {ja: "版 2 のみ。同じ提案に並べる 2 つ目以降の値", en: "Version 2 only. Further values of the same proposal"}}
  - {name: pfs_more, title: {ja: PFS（追加）, en: PFS (more)}, type: "list<enum>", values: [dh1, dh2, dh5, dh14, dh15, dh16, dh19, dh20, dh21, dh24], note: {ja: "版 2 のみ。PFS に並べる 2 つ目以降のグループ（NEC IX の child-pfs）", en: "Version 2 only. Further groups for PFS (child-pfs of NEC IX)"}}
  - {name: peer_backup, title: {ja: 予備の相手, en: Backup peers}, type: "list<string>", note: {ja: "相手アドレスの相手につながらないときに、順につなぎに行く相手（アドレスか名前）。鍵は同じ（Cisco のクリプトマップの 2 つ目以降の set peer）", en: "The peers tried in their order when the peer of the row does not answer (an address or a name), with the same key (the second and the later set peer of a Cisco crypto map)"}}
  - {name: outer_vrf, title: {ja: 外側の VRF, en: Outer VRF}, type: ref, ref: vrfs.name, note: {ja: "暗号化した通信と IKE が通る VRF（Cisco の fvrf）。空 = VRF なし。方式が policy の行では、自分側 IF の VRF と同じにする", en: "The VRF the encrypted traffic and IKE run in (the fvrf of Cisco). Empty = no VRF. On a row of the style policy it is the VRF of the local interface"}}
  - {name: inner_vrf, title: {ja: 内側の VRF, en: Inner VRF}, type: ref, ref: vrfs.name, note: {ja: "守る通信が属する VRF（Cisco の ivrf）。方式が policy の行だけに書く。空 = 外側の VRF と同じ。方式が tunnel_if の行では、トンネル IF の VRF（インタフェースのシート）が内側", en: "The VRF the protected traffic belongs to (the ivrf of Cisco). For rows of the style policy only. Empty = the outer VRF. With the style tunnel_if the VRF of the tunnel interface (the Interfaces sheet) is the inner one"}}
  - {name: nat_demux, title: {ja: 同じ NAT の後ろの端末を見分ける, en: Tell peers behind one NAT apart}, type: bool, note: {ja: "L2TP/IPsec の受け口で、同じ NAT の後ろから複数の端末がつなぐとき（Cisco の set nat demux）", en: "For the callers of L2TP over IPsec that sit behind one NAT (set nat demux of Cisco)"}}
  - {name: peer_default, title: {ja: つなぎ直しは最初の相手から, en: Retry the first peer first}, type: bool, note: {ja: "予備の相手があるとき、相手が応えなくなったら、次の相手の前に最初の相手（相手アドレス）をもう一度試す（Cisco の set peer … default）", en: "With backup peers: when the peer stops answering, the first peer (the peer address) is tried again before the next one (set peer ... default of Cisco)"}}
