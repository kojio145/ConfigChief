  - {name: provision, title: {ja: 機種の種別, en: Provisioned type}, type: string, note: {ja: "そのメンバーの機種の種別（機器が設定に持つ語）", en: "The type of the member, as the device has it in its configuration"}}
  - {name: priority, title: {ja: 優先度, en: Priority}, type: int, min: 1, note: {ja: "大きいほどマスターになりやすい", en: "The higher, the more likely the master"}}
  - {name: description, title: {ja: 説明, en: Description}, type: string}
