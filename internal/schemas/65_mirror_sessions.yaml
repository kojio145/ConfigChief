  - {name: sources_both, title: {ja: 写す元（両方向）, en: Sources (both directions)}, type: "list<ifname>"}
  - {name: sources_rx, title: {ja: 写す元（受信）, en: Sources (received)}, type: "list<ifname>"}
  - {name: sources_tx, title: {ja: 写す元（送信）, en: Sources (sent)}, type: "list<ifname>"}
