table: ntp_servers
title: {ja: NTP サーバ, en: NTP servers}
since: M1
key: [device, server]
columns:
  - {name: device, title: {ja: 機器, en: Device}, type: ref, ref: devices.hostname, required: true, note: {ja: "ホスト名。* は全機器、@グループ名 はそのグループの機器", en: "Host name. * = every device, @group = the devices of the group"}}
  - {name: server, title: {ja: サーバ, en: Server}, type: string, required: true, note: {ja: "アドレスか名前", en: "An address or a name"}}
  - {name: prefer, title: {ja: 優先, en: Prefer}, type: bool}
  - {name: source_if, title: {ja: 送信元 IF, en: Source interface}, type: ifname}
  - {name: vrf, title: {ja: VRF, en: VRF}, type: ref, ref: vrfs.name}
  - {name: auth_key_id, title: {ja: 認証の鍵番号, en: Authentication key ID}, type: int, min: 1, max: 4294967295, note: {ja: "このサーバを確かめる鍵の番号。空 = 認証しない", en: "The number of the key that proves this server. Empty = no authentication"}}
  - {name: auth_key, title: {ja: 認証の鍵, en: Authentication key}, type: secret, note: {ja: "その番号の鍵（MD5）。同じ番号の行は同じ鍵にする", en: "The key of that number (MD5). Rows with the same number carry the same key"}}
