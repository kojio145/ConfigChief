table: ipsec_selectors
title: {ja: IPsec 対象通信, en: IPsec selectors}
since: M4
key: [device, tunnel, seq]
columns:
  - {name: device, title: {ja: 機器, en: Device}, type: ref, ref: devices.hostname, required: true, note: {ja: "ホスト名。* は全機器、@グループ名 はそのグループの機器", en: "Host name. * = every device, @group = the devices of the group"}}
  - {name: tunnel, title: {ja: IPsec の名前, en: Tunnel}, type: ref, ref: ipsec_tunnels.name, required: true}
  - {name: seq, title: {ja: 順番, en: Sequence}, type: int, required: true}
  - {name: local_net, title: {ja: 自分側ネットワーク, en: Local network}, type: net4, required: true, note: {ja: "すべてなら 0.0.0.0/0", en: "0.0.0.0/0 for everything"}}
  - {name: remote_net, title: {ja: 相手側ネットワーク, en: Remote network}, type: net4, required: true, note: {ja: "すべてなら 0.0.0.0/0", en: "0.0.0.0/0 for everything"}}
  - {name: protocol, title: {ja: プロトコル, en: Protocol}, type: string, note: {ja: "ip（すべて）・udp・tcp など。空 = ip", en: "ip (everything), udp, tcp and the like. Empty = ip"}}
  - {name: local_port, title: {ja: 自分側ポート, en: Local port}, type: int, min: 1, max: 65535, note: {ja: "プロトコルが udp・tcp のとき。L2TP を守るなら udp の 1701", en: "With udp or tcp. 1701 of udp protects L2TP"}}
  - {name: remote_port, title: {ja: 相手側ポート, en: Remote port}, type: int, min: 1, max: 65535, note: {ja: "プロトコルが udp・tcp のとき", en: "With udp or tcp"}}
