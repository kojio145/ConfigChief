table: pppoe
title: {ja: PPPoE, en: PPPoE}
since: M4
key: [device, name]
columns:
  - {name: device, title: {ja: 機器, en: Device}, type: ref, ref: devices.hostname, required: true, note: {ja: "ホスト名。* は全機器、@グループ名 はそのグループの機器", en: "Host name. * = every device, @group = the devices of the group"}}
  - {name: name, title: {ja: 名前, en: Name}, type: string, required: true, auto_name: true, note: {ja: "メーカーに名前が無ければ、取り込み時に論理 IF の名前を入れる。比べるときは、名前でなく中身で行を合わせる", en: "The logical interface on import where the vendor has no name. Rows are matched by what they hold, not by this name"}}
  - {name: physical_if, title: {ja: 物理 IF, en: Physical interface}, type: ifname, required: true, note: {ja: "回線につながる IF", en: "The interface the line is on"}}
  - {name: logical_if, title: {ja: 論理 IF, en: Logical interface}, type: ifname, required: true, note: {ja: "アドレスや NAT を設定する IF。インタフェースのシートに行を持つ", en: "The interface that has the address and NAT. It has a row on the Interfaces sheet"}}
  - {name: username, title: {ja: 接続 ID, en: User name}, type: string, required: true}
  - {name: password, title: {ja: 接続パスワード, en: Password}, type: secret, required: true}
  - {name: auth, title: {ja: 認証方式, en: Authentication}, type: enum, values: [chap, pap, chap_pap]}
  - {name: service_name, title: {ja: サービス名, en: Service name}, type: string}
  - {name: default_route, title: {ja: デフォルト経路を作る, en: Default route}, type: bool}
  - {name: keepalive, title: {ja: 監視間隔（秒）, en: Keepalive (s)}, type: int}
  - {name: auth_both, title: {ja: 相手も認証する, en: Authenticate the peer}, type: bool, note: {ja: "こちらからも相手に認証を求める", en: "This side asks the peer to authenticate too"}}
  - {name: on_demand, title: {ja: 通信があるときだけつなぐ, en: On demand}, type: bool}
  - {name: idle_timeout, title: {ja: 無通信で切る時間（秒）, en: Idle timeout (s)}, type: int, min: 0}
  - {name: dial_trigger, title: {ja: つなぐきっかけの通信, en: Dial trigger}, type: string, note: {ja: "ip（IP の通信すべて）か、ACL の名前", en: "ip (every IP packet) or the name of an ACL"}}
  - {name: restart_delay, title: {ja: つなぎ直すまでの待ち（秒）, en: Restart delay (s)}, type: int, min: 1, max: 3600}
  - {name: mac_override, title: {ja: MAC アドレスを論理 IF のものにする, en: MAC override}, type: bool}
