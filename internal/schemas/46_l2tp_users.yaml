  - {name: group, title: {ja: L2TP の名前, en: L2TP group}, type: ref, ref: l2tp_groups.name, required: true}
  - {name: name, title: {ja: 接続 ID, en: User name}, type: string, required: true}
  - {name: password, title: {ja: 接続パスワード, en: Password}, type: secret, required: true, note: {ja: "CHAP で確かめるので、ハッシュでは持てない", en: "Checked by CHAP, so it cannot be kept as a hash"}}
  - {name: address, title: {ja: 固定で払い出すアドレス, en: Static address}, type: ip4}
