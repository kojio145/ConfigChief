    title: under が読めない
    severity: error
    under: '(?=interface)'
    forbid_line: '^shutdown$'
  - id: P-110
    title: 行のルールに表
    severity: error
    table: interfaces
    require_line: '^hostname '
  - id: P-111
    title: 表がない
    severity: error
    table: no_such_table
    expr: 'row.name != ""'
