# Every rule here is written wrong, each in its own way.
rules:
  - title: id がない
    severity: error
    require_line: '^hostname '
  - id: G-610
    title: ツールのチェックと同じ形
    severity: error
    require_line: '^hostname '
  - id: P-103
    severity: error
    require_line: '^hostname '
  - id: P-104
    title: 重大度がない
    require_line: '^hostname '
  - id: P-105
    title: 重大度が違う
    severity: fatal
    require_line: '^hostname '
  - id: P-106
    title: 種類がない
    severity: error
