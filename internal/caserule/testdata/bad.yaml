    title: 列を書いていない
    severity: error
    unique: {table: interfaces}
  - id: P-116
    title: scope が違う
    severity: error
    unique: {table: interfaces, column: ipv4, scope: site}
  - id: P-117
    title: そろえるルールに scope
    severity: error
    equal_across: {table: ntp_servers, column: server, scope: device}
  - id: P-118
    title: 式のルールに under
    severity: error
    table: interfaces
    under: '^interface '
    expr: 'row.name != ""'
  - id: P-119
    title: 表を外に書いた
    severity: error
    table: interfaces
    unique: {table: interfaces, column: ipv4}
  - id: P-120
    title: 空の正規表現
    severity: error
