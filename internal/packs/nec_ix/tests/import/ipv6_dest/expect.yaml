# IPv6 destinations of the management and of the line monitoring (appendix
# A 3.23, made-up values). The community of IPv6 goes into the row of the
# community of that name; the IPv6 source of syslog (an address) becomes the
# interface that has it.
tables:
  devices:
    - hostname: ix-v01
      name_servers: [192.0.2.53, "2001:db8:0:53::1"]
  snmp_communities:
    - {community: example-ro, access: ro}
  snmp_hosts:
    - {host: "2001:db8:0:162::1", version: 2c, community: example-ro, source_if: GigaEthernet1.0}
  ntp_servers:
    - {server: "2001:db8:0:123::1"}
  syslog_servers:
    - {server: "2001:db8:0:50::1", source_if: GigaEthernet1.0}
  tracks:
    - {id: wg-v6-host, type: icmp, target: "2001:db8:ff::10", via_if: GigaEthernet1.0, source_ip: "2001:db8:0:2::1", interval: 10}
    - {id: wg-v6-route, type: route, target: "2001:db8:100::/48", via_if: GigaEthernet1.0}
