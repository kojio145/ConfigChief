# IPv6 (appendix A 3.23; made-up values): an IPoE line with a delegated
# prefix, router advertisements, DHCPv6, the ND proxy, OSPFv3 and the tunnels
# that carry IPv4 over IPv6.
tables:
  devices:
    - {hostname: ix-v02, forward_cache_ipv6: true}
  interfaces:
    - {name: GigaEthernet0.0}
    - {name: GigaEthernet1.0, ipv4: 192.0.2.1/24}
    - {name: GigaEthernet2.0, ipv6: ["2001:db8:0:1::1/64"]}
    - {name: GigaEthernet2.1, encap_vlan: 10}
    - {name: GigaEthernet2.2, encap_vlan: 20}
    - {name: Loopback0.0, ipv6: ["2001:db8::2/128"]}
    - {name: Tunnel0.0, ipv4: "unnumbered:GigaEthernet1.0", tcp_mss: 1420}
    - {name: Tunnel1.0}
    - {name: Tunnel2.0}
  ipv6_interfaces:
    - {if_name: GigaEthernet0.0, enabled: true, autoconfig: true, autoconfig_default: true, acl_in: v6-sample-in, pd_request: pd-sample, rapid_commit: true, dhcp_request: [dns, ntp]}
    - if_name: GigaEthernet1.0
      tcp_mss: auto
      enabled: true
      pd_from: pd-sample
      pd_suffix: "::1/64"
      pd_eui64: true
      ra: send
      ra_interval: 200
      ra_interval_min: 50
      ra_lifetime: 1800
      ra_other: true
      ra_dns: ["2001:db8::53", "2001:db8::54"]
      ra_dns_lifetime: 600
      dhcp_server: dhcpv6-sample-lan
      dhcp_dns: ["2001:db8::53", dhcp]
      dhcp_ntp: [dhcp]
    - {if_name: GigaEthernet2.0, eui64: ["2001:db8:0:11::/64"], mtu: 1400}
    - {if_name: GigaEthernet2.1, nd_proxy: GigaEthernet2.2, pd_request: "", dhcp_info_only: true, dhcp_request: [dns]}
    - {if_name: GigaEthernet2.2, enabled: true}
  ipv6_ra_prefixes:
    - {if_name: GigaEthernet2.0, prefix: "2001:db8:0:1::/64", valid_lifetime: 86400, preferred_lifetime: 14400, on_link: true, autonomous: false}
    - {if_name: GigaEthernet2.0, prefix: "2001:db8:0:11::/64", valid_lifetime: 2592000, preferred_lifetime: 604800, on_link: false, autonomous: false}
  ipv6_routes:
    - {prefix: "::/0", next_hop: "", out_if: GigaEthernet0.0, gateway_from: ra}
    - {prefix: "2001:db8:100::/48", next_hop: "fe80::2", out_if: GigaEthernet2.0, distance: 10}
    - {prefix: "2001:db8:200::/48", next_hop: "2001:db8:0:1::2", out_if: ""}
  ipv6_acl_entries:
    - {acl: v6-sample-in, seq: 10, action: permit, protocol: tcp, src: any, src_port: "", dst: "2001:db8:0:10::/64", dst_port: "443", flags: [established]}
    - {acl: v6-sample-in, seq: 20, action: permit, protocol: udp, src: "2001:db8::53", src_port: "53", dst: any, dst_port: "1024-65535"}
    - {acl: v6-sample-in, seq: 30, action: permit, protocol: icmp, src: any, dst: any, icmp_type: neighbor-solicitation}
    - {acl: v6-sample-in, seq: 40, action: permit, protocol: icmp, src: any, dst: any, icmp_type: "134"}
    - {acl: v6-sample-in, seq: 50, action: permit, protocol: icmp, src: any, dst: any, icmp_type: "1", icmp_code: 4}
    - {acl: v6-sample-in, seq: 60, action: deny, protocol: ip, src: any, dst: any}
    - {acl: v6-sample-seq, seq: 100, action: permit, protocol: ip, src: "2001:db8:1::/48", dst: any, dscp: 46}
    - {acl: v6-sample-seq, seq: 200, action: permit, protocol: tcp, src: any, dst: any, dst_port: "443", flags: [syn]}
  ipv6_prefix_lists:
    - {name: pl6-sample, seq: 5, action: permit, prefix: "2001:db8::/32", ge: 48, le: 64}
    - {name: pl6-sample, seq: 10, action: deny, prefix: "::/0", le: 128}
  ospfv3_processes:
    - {process_id: 1, router_id: 192.0.2.2, default_originate: when_present, default_metric: 10, redistribute: [connected, static]}
  ospfv3_redistribute:
    - {process_id: 1, source: static, metric: "", filter: rm-sample}
  ospfv3_interfaces:
    - {process_id: 1, if_name: GigaEthernet2.0, area: "0", cost: 20, priority: 100, hello: 5, dead: 20}
    - {process_id: 1, if_name: Loopback0.0, area: "1", passive: true}
  ospfv3_areas:
    - {process_id: 1, area: "1", type: totally_stub, ranges: ["2001:db8:0:10::/60"], ranges_hidden: ["2001:db8:0:20::/60"]}
  tunnels:
    - {if_name: Tunnel0.0, type: ipv4_over_ipv6, source: GigaEthernet0.0, destination_fqdn: aftr.example.jp}
    - {if_name: Tunnel1.0, type: map_e, provider: ocn}
    - {if_name: Tunnel2.0, type: auto_ipip, lan_if: GigaEthernet1.0}
unknown:
  - "ipv6 route 2001:db8:300::/48 2001:db8:0:1::2 metric 2"
  - "ipv6 access-list dynamic v6-dyn-sample access v6-sample-in"
  - "tunnel v6pv url https://example.com/"
