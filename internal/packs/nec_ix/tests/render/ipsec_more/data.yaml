# More candidates than one (appendix A 3.20, made-up values): the rows of
# ipsec_proposals become further proposals, which the IKE policy and the map
# list after the first one. expect.txt is the configuration the tables must
# turn into.
tables:
  devices:
    - hostname: ix-c05
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.9/29}
    - {name: GigaEthernet1.0, enabled: true, ipv4: 198.51.100.1/24}
    - {name: Tunnel0.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
  tunnels:
    - {if_name: Tunnel0.0, type: ipsec}
  ipsec_tunnels:
    - {name: Tunnel0.0, style: tunnel_if, tunnel_if: Tunnel0.0, peer_address: 203.0.113.20, psk: dummy-psk-more-a, ike_version: 1, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 28800, esp_encryption: aes256, esp_hash: sha1, pfs: dh14, ipsec_lifetime: 3600}
  ipsec_proposals:
    - {tunnel: Tunnel0.0, phase: ike, seq: 20, encryption: aes128, hash: sha1, dh: dh14, lifetime: 28800}
    # Nothing written: what the device offers by itself.
    - {tunnel: Tunnel0.0, phase: ike, seq: 30}
    - {tunnel: Tunnel0.0, phase: ipsec, seq: 20, encryption: aes128, hash: sha1, lifetime: 7200, lifetime_kb: 100000}
    - {tunnel: Tunnel0.0, phase: ipsec, seq: 30, encryption: 3des, ah_hash: sha1}
