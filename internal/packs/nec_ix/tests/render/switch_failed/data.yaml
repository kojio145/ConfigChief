# What the pack refuses to write about VLANs and the built-in switch
# (made-up values).
tables:
  devices:
    - hostname: ix-s04
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.2/30}
    - {name: GigaEthernet0.1, enabled: true, encap_vlan: 10, encap_native: true}   # the base interface takes what has no tag
    - {name: GigaEthernet1.0, enabled: true}
    - {name: "GigaEthernet2:1.0", enabled: true, ipv4: 192.0.2.1/25, vlan_id: 10}
    - {name: "GigaEthernet2:port1", enabled: true}
    - {name: "GigaEthernet2:port2", enabled: true}
    - {name: "GigaEthernet2:port3", enabled: true}
    - {name: "GigaEthernet2:port4", enabled: true, speed: 10000}
    - {name: BVI0, enabled: true, bridge_group: 5}                  # the switch of the whole device is off
  switchports:
    - {if_name: GigaEthernet1.0, mode: access, access_vlan: 10}     # not a port of the switch
    - {if_name: "GigaEthernet2:port1", mode: access, access_vlan: 10}
    - {if_name: "GigaEthernet2:port2", mode: trunk}                 # VLAN 10 is a port VLAN: no trunk carries it
    - {if_name: "GigaEthernet2:port3", mode: dynamic_auto}
    - {if_name: "GigaEthernet2:port4", mode: access, access_vlan: 10}
  lags:
    - {if_name: "GigaEthernet2:port3", group: 1, mode: active}      # static only
    - {if_name: GigaEthernet1.0, group: 1, mode: "on"}
findings: [G-601, G-614]
