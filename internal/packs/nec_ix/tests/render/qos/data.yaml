# QoS (made-up values). expect.txt is the configuration the tables must turn
# into; the text is read back and compared with the tables.
tables:
  devices:
    - hostname: ix-q11
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.1/30}
    - {name: GigaEthernet1.0, enabled: true, ipv4: 192.0.2.1/24}
    - {name: GigaEthernet2.0, enabled: true, ipv4: 198.51.100.1/24}
  acls:
    - {name: al-q-biz, type: extended}
  acl_entries:
    - {acl: al-q-biz, seq: 10, action: permit, protocol: ip, src: 192.0.2.0/24, dst: 203.0.113.9, precedence: 5}
    - {acl: al-q-biz, seq: 20, action: permit, protocol: tcp, src: any, dst: any, dst_port: "443", dscp: 18}
  qos_classes:
    - {name: cm-q-voice, match: any}
    - {name: cm-q-video, match: all}
    - {name: cm-q-biz, match: any}
  qos_class_matches:
    - {class: cm-q-voice, seq: 10, dscp: [46], queue: high}
    - {class: cm-q-voice, seq: 20, precedence: [5]}
    - {class: cm-q-video, seq: 10, dscp: [34, 36]}
    - {class: cm-q-biz, seq: 10, acl: al-q-biz, queue: normal}
    - {class: cm-q-biz, seq: 20, queue: low}
  qos_policies:
    - {policy: pm-q-out, class: cm-q-voice, seq: 10, priority: true, bandwidth_kbps: 512, priority_burst: 4000}
    - {policy: pm-q-out, class: cm-q-video, seq: 20, bandwidth_percent: 30, shape_bps: 4000000, shape_bc: 16000, shape_be: 0}
    - {policy: pm-q-out, class: cm-q-biz, seq: 30, queue_limit: [10, 20, 30, 40]}
    - {policy: pm-q-out, class: default, seq: 40, bandwidth_kbps: 1000}
    - {policy: pm-q-in, class: cm-q-biz, seq: 10, set_dscp: 18}
    - {policy: pm-q-in, class: local, seq: 20, set_precedence: 6}
    - {policy: pm-q-pq, class: cm-q-biz, seq: 10}
  qos_bindings:
    - {if_name: GigaEthernet0.0, direction: output, policy: pm-q-out, shape_bps: 10000000, shape_bc: 10000}
    - {if_name: GigaEthernet1.0, direction: input, policy: pm-q-in}
    - {if_name: GigaEthernet1.0, direction: output, policy: pm-q-pq}
    - {if_name: GigaEthernet2.0, direction: output, shape_bps: 2000000}
