# IPsec on tunnel interfaces (made-up values). expect.txt is the
# configuration the tables must turn into. The tunnel of the type ipsec has
# neither a source nor a destination; the access list that lets everything
# through is made by the pack.
tables:
  devices:
    - hostname: ix-v01
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.9/30}
    - {name: GigaEthernet1.0, enabled: true, ipv4: 198.51.100.1/24}
    - {name: Tunnel0.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
    - {name: Tunnel1.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
  tunnels:
    - {if_name: Tunnel0.0, type: ipsec}
    - {if_name: Tunnel1.0, type: ipsec}
  ipsec_tunnels:
    - {name: Tunnel0.0, style: tunnel_if, tunnel_if: Tunnel0.0, peer_address: 203.0.113.20, psk: dummy-psk-sample-a, ike_version: 1, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 28800, esp_encryption: aes256, esp_hash: sha1, pfs: dh14, ipsec_lifetime: 3600, dpd_interval: 30, dpd_retry: 3, nat_traversal: true}
    # The name of a row is free.
    - {name: vpn-sample-b, style: tunnel_if, tunnel_if: Tunnel1.0, peer_address: 203.0.113.30, psk: dummy-psk-sample-b, ike_version: 1, ike_mode: aggressive, ike_encryption: aes128, ike_hash: sha1, ike_dh: dh5, ike_lifetime: 28800, esp_encryption: aes128, esp_hash: sha256, pfs: none, nat_traversal: true}
  static_routes:
    - {prefix: 192.0.2.0/26, out_if: Tunnel0.0}
