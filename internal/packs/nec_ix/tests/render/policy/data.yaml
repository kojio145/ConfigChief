# Access lists and prefix lists (made-up values). expect.txt is the
# configuration the tables must turn into.
tables:
  devices:
    - hostname: ix-p01
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.25/30, acl_in: acl-sample-in}
  acls:
    - {name: acl-sample-in, type: extended}
    - {name: acl-sample-mgmt}
  acl_entries:
    - {acl: acl-sample-in, seq: 10, action: permit, protocol: tcp, src: 198.51.100.0/24, dst: any, dst_port: "443"}
    - {acl: acl-sample-in, seq: 20, action: permit, protocol: udp, src: any, src_port: "53", dst: 198.51.100.0/24}
    - {acl: acl-sample-in, seq: 30, action: permit, protocol: tcp, src: any, dst: 192.0.2.80, dst_port: ">1023"}
    - {acl: acl-sample-in, seq: 40, action: permit, protocol: udp, src: any, dst: any, dst_port: "!123"}
    - {acl: acl-sample-in, seq: 50, action: permit, protocol: icmp, src: any, dst: any}
    - {acl: acl-sample-in, seq: 60, action: deny, protocol: ip, src: any, dst: any}
    - {acl: acl-sample-mgmt, seq: 10, action: permit, protocol: ip, src: 192.0.2.0/24, dst: any}
  prefix_lists:
    - {name: pl-sample-in, seq: 5, action: permit, prefix: 0.0.0.0/0}
    - {name: pl-sample-out, seq: 10, action: permit, prefix: 198.51.100.0/24, le: 28}
    - {name: pl-sample-out, seq: 20, action: deny, prefix: 0.0.0.0/0, le: 32}
