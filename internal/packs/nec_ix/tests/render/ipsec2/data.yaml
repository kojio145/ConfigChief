# The rest of IPsec (appendix A 3.20, made-up values). IKE version 1: a peer
# by name with a key in hexadecimal, identities, NAT traversal for one
# policy, AH and a lifetime in kilobytes; a peer "any" (a dynamic map). IKE
# version 2: a profile for each tunnel, the keys by identity. expect.txt is
# the configuration the tables must turn into.
tables:
  devices:
    - hostname: ix-c01
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.9/29}
    - {name: GigaEthernet1.0, enabled: true, ipv4: 198.51.100.1/24}
    - {name: Tunnel0.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
    - {name: Tunnel1.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
    - {name: Tunnel2.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
    - {name: Tunnel3.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
    - {name: Tunnel4.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
    - {name: Tunnel5.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
  tunnels:
    - {if_name: Tunnel0.0, type: ipsec}
    - {if_name: Tunnel1.0, type: ipsec}
    - {if_name: Tunnel2.0, type: ipsec, destination: 203.0.113.30}
    # The source of the tunnel: the own identity where none is written.
    - {if_name: Tunnel3.0, type: ipsec, source: GigaEthernet0.0, destination: 203.0.113.40}
    - {if_name: Tunnel4.0, type: ipsec}
    - {if_name: Tunnel5.0, type: ipsec}
  ipsec_tunnels:
    - {name: Tunnel0.0, style: tunnel_if, tunnel_if: Tunnel0.0, peer_address: ix-c02.example.com, local_id: "fqdn:ix-c01.example.com", remote_id: "email:netops@example.com", psk: 64756d6d792d6b65792d61, psk_form: hex, ike_version: 1, ike_mode: aggressive, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 28800, esp_encryption: aes256, esp_hash: sha512, ah_hash: sha256, pfs: dh14, ipsec_lifetime: 3600, ipsec_lifetime_kb: 100000, dpd_interval: 30, dpd_retry: 5, nat_traversal: true, nat_keepalive: 30, nat_force: true}
    - {name: Tunnel1.0, style: tunnel_if, tunnel_if: Tunnel1.0, peer_address: any, remote_id: "keyid:sample-site-b", psk: dummy-psk-v1-b, ike_version: 1, ike_mode: aggressive, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 28800, esp_encryption: aes128, esp_hash: sha1, ipsec_lifetime: 7200}
    - {name: Tunnel2.0, style: tunnel_if, tunnel_if: Tunnel2.0, peer_address: 203.0.113.30, local_id: "keyid:sample-site-a", remote_id: "keyid:sample-site-c", psk: dummy-psk-v2-a, psk_remote: dummy-psk-v2-c, ike_version: 2, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_prf: sha384, ike_lifetime: 86400, esp_encryption: aes256, esp_hash: sha256, pfs: dh14, ipsec_lifetime: 28800, always_on: true, dpd_interval: 20, dpd_retry: 5, dpd_retry_interval: 10, dpd_mode: periodic}
    - {name: Tunnel3.0, style: tunnel_if, tunnel_if: Tunnel3.0, peer_address: 203.0.113.40, psk: dummy-psk-v2-d, ike_version: 2, ike_encryption: aes256gcm, ike_hash: sha256, ike_dh: dh14, ike_prf: sha384, ike_lifetime: 43200, esp_encryption: aes256, esp_hash: sha256, ipsec_mode: transport, pfs: none, ipsec_lifetime: 7200, nat_traversal: true, nat_keepalive: 30, nat_force: true}
    - {name: Tunnel4.0, style: tunnel_if, tunnel_if: Tunnel4.0, peer_address: ix-c05.example.com, local_id: "email:netops@example.com", psk: 64756d6d792d6b65792d61, psk_remote: 64756d6d792d6b65792d62, psk_form: hex, ike_version: 2, ike_lifetime: 86400, ipsec_lifetime: 28800, always_on: false, dpd_interval: 60, dpd_retry: 4, nat_traversal: false}
    # A peer whose address is not known; the proposals are left to the device.
    - {name: Tunnel5.0, style: tunnel_if, tunnel_if: Tunnel5.0, peer_address: any, local_id: "keyid:sample-site-a", remote_id: "fqdn:ix-c06.example.com", psk: dummy-psk-v2-a, psk_remote: dummy-psk-v2-e, ike_version: 2, ike_lifetime: 86400, ipsec_lifetime: 28800}
