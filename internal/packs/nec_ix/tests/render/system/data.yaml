# The device as a whole, appendix A 3.26 (made-up values): the log the
# device keeps, the severity per subsystem, the time stamp, the switches of
# the device, the name servers of a VRF, the source of syslog by its
# address, the description of a port, the MSS taken from the MTU, and the
# password of an L2TP tunnel in the encrypted form of the device.
tables:
  devices:
    - hostname: ix-d02
      vendor: nec_ix
      log_buffer: true
      log_buffer_size: 100000
      log_buffer_mode: one_time
      log_severity: notifications
      log_timestamp: time
      password_encryption: true
      forward_cache: true
      forward_cache_ipv6: true
      ntp_serve: true
      name_servers: [192.0.2.53, 192.0.2.54]
      name_servers_vrf: vrf-sample-m
  log_subsystems:
    - {subsystem: ike, severity: informational}
    - {subsystem: ppp, severity: debugging}
  vrfs:
    - {name: vrf-sample-m}
  syslog_servers:
    - {server: 192.0.2.50, source_if: Loopback0.0}
    - {server: 198.51.100.50, vrf: vrf-sample-m, source_if: GigaEthernet1.0}
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.21/30, tcp_mss: auto, port_description: sample uplink port}
    - {name: GigaEthernet0.1, enabled: true}
    - {name: GigaEthernet1.0, enabled: true, vrf: vrf-sample-m, ipv4: 198.51.100.1/24, speed: 1000, port_description: sample lan port}
    - {name: Loopback0.0, enabled: true, ipv4: 192.0.2.1/32}
    - {name: Tunnel0.0, enabled: true}
  l2tp_groups:
    - {name: lac-sample, role: lac, logical_ifs: [Tunnel0.0], access_ifs: [GigaEthernet0.1], peer_address: 203.0.113.22, tunnel_auth: true, password: "secret dummySampleEncryptedValue", domains: [example.com]}
