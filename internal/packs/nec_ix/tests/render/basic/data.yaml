# The design data of one device (made-up values), written as the tables of
# appendix A. expect.txt is the configuration it must turn into. A row without
# "device" belongs to the device of the test.
tables:
  devices:
    - hostname: ix-c01
      vendor: nec_ix
      model: sample-model
      site: sample-site-c
      name_servers: [192.0.2.53, 192.0.2.54]
      timezone: "+9"
      snmp_location: sample-site-c rack 2
      snmp_contact: netops@example.net
  interfaces:
    - {name: Loopback0.0, description: sample loopback, enabled: true, ipv4: 192.0.2.9/32}
    - {name: Null0.0, enabled: true}
    - name: GigaEthernet0.0
      description: to ix-c02
      enabled: true
      ipv4: 203.0.113.9/30
      acl_in: acl-sample-in
      acl_out: acl-sample-out
      speed: auto
      duplex: auto
    - name: GigaEthernet1.0
      description: sample lan
      enabled: true
      ipv4: 198.51.100.129/25
      ipv4_secondary: [198.51.100.1/25]
      ipv6: ["2001:db8:0:1::1/64"]
      dhcp_relay: [192.0.2.67]
      proxy_arp: true
      tcp_mss: 1360
      ip_mtu: 1400
      speed: 1000
      duplex: full
    - {name: GigaEthernet1.1, description: sample vlan 30, enabled: true, encap_vlan: 30, ipv4: 192.0.2.129/26}
    - {name: GigaEthernet2.0, enabled: false}
  static_routes:
    - {prefix: 0.0.0.0/0, next_hop: 203.0.113.10}
    - {prefix: 192.0.2.64/26, next_hop: 203.0.113.10, distance: 10}
    - {prefix: 198.18.30.0/24, next_hop: 203.0.113.10, out_if: GigaEthernet0.0}
    - {prefix: 198.18.40.0/24, out_if: GigaEthernet1.1}
  users:
    - {name: admin, privilege: admin, secret: dummy0hash0sample0admin0004, secret_form: hashed}
    - {name: operator, privilege: operator, secret: dummy0hash0sample0oper00005, secret_form: hashed}
    - {name: monitor, privilege: monitor, secret: dummy-monitor-secret-sample}
    - {name: backup, secret: dummy-backup-secret-sample}
  remote_access:
    - {protocols: [telnet, ssh], acl: acl-sample-mgmt, idle_timeout: 10}
  ntp_servers:
    - {server: 192.0.2.123, source_if: Loopback0.0}
    - {server: 192.0.2.124, source_if: Loopback0.0}
  syslog_servers:
    - {server: 192.0.2.50, facility: local6}
    - {server: 192.0.2.51, facility: local6}
  snmp_communities:
    - {community: dummy-ro-comm, access: ro, acl: acl-sample-mgmt}
    - {community: dummy-rw-comm, access: rw}
  snmp_hosts:
    - {host: 192.0.2.60, version: 2c, community: dummy-ro-comm, source_if: Loopback0.0}
