# RIP and RIPng (appendix A 3.27; made-up values).
tables:
  devices:
    - hostname: ix-r02
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 192.0.2.1/30}
    - {name: GigaEthernet1.0, enabled: true, ipv4: 192.0.2.129/25}
  bgp_processes:
    - {vrf: "", asn: 64496, router_id: 203.0.113.1}
  ospf_processes:
    - {process_id: 1, router_id: 203.0.113.1}
  ospfv3_processes:
    - {process_id: 1, router_id: 203.0.113.1}
  ipv6_interfaces:
    - {if_name: GigaEthernet0.0, enabled: true}
    - {if_name: GigaEthernet1.0, enabled: true}
  rip_processes:
    - family: ipv4
      auto_summary: true
      default_metric: 3
      distance: 130
      prefix_list_in: pl-sample-in
      default_originate: true
      default_originate_metric: 2
      timer_update: 10
      timer_invalid: 60
      timer_flush: 80
    - {family: ipv6, distance: 130, prefix_list_in: pl6-sample-in, default_originate: true}
  rip_interfaces:
    - family: ipv4
      if_name: GigaEthernet0.0
      send_version: ["1", "2"]
      receive_version: ["2"]
      auth_mode: text
      auth_key: Example-Rip-0
      metric_offset: 2
      split_horizon: none
      summary: ["198.51.100.0/24"]
      default_originate: true
      default_originate_metric: 3
      prefix_list_out: pl-sample-out
    - {family: ipv4, if_name: GigaEthernet1.0, send: false, send_version: ["2"], v2_broadcast: true}
    - {family: ipv6, if_name: GigaEthernet0.0, metric_offset: 2, split_horizon: split_horizon, summary: ["2001:db8:10::/48"], default_originate: true, default_originate_metric: 3, prefix_list_out: pl6-sample-out}
    - {family: ipv6, if_name: GigaEthernet1.0, receive: false}
  rip_redistribute:
    - {family: ipv4, source: static, metric: 2, tag: 10, filter: rm-sample-rip}
    - {family: ipv4, source: ospf, process_id: 1}
    - {family: ipv4, source: bgp, metric: 5}
    - {family: ipv6, source: static, metric: 2, tag: 10, filter: rm-sample-rip}
    - {family: ipv6, source: ospf, process_id: 1}
