# The rest of IPsec (made-up values; appendix A 3.13 and 3.20). expect.txt
# is the configuration the tables must turn into: a tunnel interface of IKE
# version 1 with a selector (the identities of the second phase of its
# map), a dynamic map bound to its IKE policy, and tunnel interfaces of IKE
# version 2 with a selector (the traffic selectors of the profile), one of
# them with a protocol and a port.
tables:
  devices:
    - hostname: ix-h03
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.9/29}
    - {name: Tunnel0.0, enabled: true, ipv4: "unnumbered:GigaEthernet0.0"}
    - {name: Tunnel1.0, enabled: true, ipv4: "unnumbered:GigaEthernet0.0"}
    - {name: Tunnel2.0, enabled: true, ipv4: "unnumbered:GigaEthernet0.0"}
    - {name: Tunnel3.0, enabled: true, ipv4: "unnumbered:GigaEthernet0.0"}
  tunnels:
    - {if_name: Tunnel0.0, type: ipsec, source: GigaEthernet0.0, destination: 203.0.113.20}
    - {if_name: Tunnel1.0, type: ipsec}
    - {if_name: Tunnel2.0, type: ipsec}
    - {if_name: Tunnel3.0, type: ipsec, source: GigaEthernet0.0, destination: 203.0.113.50}
  ipsec_tunnels:
    - {name: Tunnel0.0, style: tunnel_if, tunnel_if: Tunnel0.0, peer_address: 203.0.113.20, ike_version: 2, psk: dummy-psk-sample-a, ike_lifetime: 86400, ipsec_lifetime: 28800}
    - {name: Tunnel1.0, style: tunnel_if, tunnel_if: Tunnel1.0, peer_address: 203.0.113.30, ike_version: 1, psk: dummy-psk-sample-b, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 28800, esp_encryption: aes256, esp_hash: sha1}
    - {name: Tunnel2.0, style: tunnel_if, tunnel_if: Tunnel2.0, peer_address: any, ike_version: 1, ike_mode: aggressive, remote_id: "keyid:sample-site-c", psk: dummy-psk-sample-c, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 28800, esp_encryption: aes256, esp_hash: sha1, ike_bind: true}
    - {name: Tunnel3.0, style: tunnel_if, tunnel_if: Tunnel3.0, peer_address: 203.0.113.50, ike_version: 2, psk: dummy-psk-sample-a, ike_lifetime: 86400, ipsec_lifetime: 28800}
  ipsec_selectors:
    - {tunnel: Tunnel0.0, seq: 10, local_net: 192.0.2.0/25, remote_net: 198.51.100.128/25, protocol: ip}
    - {tunnel: Tunnel1.0, seq: 10, local_net: 192.0.2.0/25, remote_net: 198.51.100.129/32, protocol: ip}
    - {tunnel: Tunnel2.0, seq: 10, local_net: 0.0.0.0/0, remote_net: 198.51.100.0/25, protocol: ip}
    - {tunnel: Tunnel3.0, seq: 20, local_net: 192.0.2.0/25, remote_net: 0.0.0.0/0, protocol: udp, remote_port: 1701}
