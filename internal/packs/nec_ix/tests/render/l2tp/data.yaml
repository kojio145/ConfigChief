# L2TP (made-up values; appendix A 3.21). expect.txt is the configuration the
# tables must turn into: an LNS for two callers at a time, with the callers
# the profile knows, and a LAC that carries the PPPoE of one domain.
tables:
  devices:
    - hostname: ix-c01
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, description: sample-wan, enabled: true, ipv4: 203.0.113.9/30}
    - {name: GigaEthernet2.0, description: sample-access, enabled: true, ipv4: 198.51.100.129/25}
    - {name: GigaEthernet2.1, enabled: true, ipv4: "unnumbered:GigaEthernet2.0"}
    - {name: GigaEthernet2.2, enabled: true, ipv4: "unnumbered:GigaEthernet2.0"}
    - {name: Loopback0.0, enabled: true, ipv4: 192.0.2.129/25}
    - {name: Tunnel0.0, enabled: true, ipv4: "unnumbered:Loopback0.0"}
    - {name: Tunnel1.0, enabled: true, ipv4: "unnumbered:Loopback0.0"}
    - {name: Tunnel2.0, enabled: true}
  l2tp_groups:
    - {name: lac-sample, role: lac, logical_ifs: [Tunnel2.0], access_ifs: [GigaEthernet2.1, GigaEthernet2.2], peer_address: 198.51.100.1, tunnel_auth: true, password: dummy-l2tp-secret-c, domains: [example.com], idle_timeout: 120}
    - {name: lns-sample, role: lns, logical_ifs: [Tunnel0.0, Tunnel1.0], tunnel_auth: false, auth: chap, pool_start: 192.0.2.131, pool_end: 192.0.2.190, dns_servers: [192.0.2.53, 192.0.2.54], ipsec_policy: ipsec-sample-ra}
  l2tp_users:
    - {group: lns-sample, name: example-user, password: dummy-l2tp-user-secret-1, address: 192.0.2.130}
    - {group: lns-sample, name: sample-user, password: dummy-l2tp-user-secret-2}
