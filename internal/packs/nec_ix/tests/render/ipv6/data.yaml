# IPv6 (appendix A 3.23; made-up values): addresses, static routes, access
# lists, prefix lists, OSPFv3, router advertisements, DHCPv6 with a delegated
# prefix, the ND proxy and the tunnels that carry IPv4 over IPv6. expect.txt
# is the configuration the tables must turn into.
tables:
  devices:
    - hostname: ix-v01
      vendor: nec_ix
      ipv6_routing: true        # the device has no line for it: told as G-614
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, description: IPoE sample}
    - {name: GigaEthernet1.0, enabled: true, description: LAN sample, ipv4: 192.0.2.1/24}
    - {name: GigaEthernet2.0, enabled: true, description: fixed sample, ipv6: ["2001:db8:0:1::1/64"]}
    - {name: GigaEthernet2.1, enabled: true, encap_vlan: 10, description: ND proxy WAN sample}
    - {name: GigaEthernet2.2, enabled: true, encap_vlan: 20, description: ND proxy LAN sample}
    - {name: Loopback0.0, enabled: true, ipv6: ["2001:db8::1/128"]}
    - {name: Tunnel0.0, enabled: true, ipv4: "unnumbered:GigaEthernet1.0"}
    - {name: Tunnel1.0, enabled: true}
    - {name: Tunnel2.0, enabled: true}
    - {name: Tunnel3.0, enabled: true, ipv4: 192.0.2.209/30}
  ipv6_interfaces:
    - {if_name: GigaEthernet0.0, enabled: true, autoconfig: true, autoconfig_default: true, acl_in: v6-sample-in, pd_request: pd-sample, rapid_commit: true, dhcp_request: [dns, ntp]}
    - if_name: GigaEthernet1.0
      pd_from: pd-sample
      pd_suffix: "::1/64"
      ra: send
      ra_interval: 200
      ra_interval_min: 50
      ra_lifetime: 1800
      ra_other: true
      ra_dns: ["2001:db8::53", "2001:db8::54"]
      ra_dns_lifetime: 600
      dhcp_server: dhcpv6-sample-lan
      dhcp_dns: ["2001:db8::53", dhcp]
    - {if_name: GigaEthernet2.0, eui64: ["2001:db8:0:11::/64"], anycast: ["2001:db8:0:12::1/64"], mtu: 1500, ra: "off"}
    - {if_name: GigaEthernet2.1, nd_proxy: GigaEthernet2.2, nd_proxy_acl: v6-sample-in, dhcp_info_only: true, dhcp_request: [dns]}
    - {if_name: GigaEthernet2.2, pd_from: pd-sample, pd_eui64: true, ra: send, ra_managed: true}
  ipv6_ra_prefixes:
    - {if_name: GigaEthernet2.0, prefix: "2001:db8:0:1::/64", valid_lifetime: 86400, preferred_lifetime: 14400, on_link: true, autonomous: false}
    - {if_name: GigaEthernet2.0, prefix: "2001:db8:0:11::/64", valid_lifetime: 2592000, preferred_lifetime: 604800, on_link: true, autonomous: true}
  ipv6_routes:
    - {prefix: "::/0", out_if: GigaEthernet0.0, gateway_from: ra}
    - {prefix: "2001:db8:100::/48", next_hop: "fe80::2", out_if: GigaEthernet2.0, distance: 10}
    - {prefix: "2001:db8:200::/48", next_hop: "2001:db8:0:1::2"}
    - {prefix: "2001:db8:300::/48", out_if: Null0.0}
  ipv6_acl_entries:
    - {acl: v6-sample-in, seq: 10, action: permit, protocol: tcp, src: any, dst: "2001:db8:0:10::/64", dst_port: "443", flags: [established]}
    - {acl: v6-sample-in, seq: 20, action: permit, protocol: udp, src: "2001:db8::53", src_port: "53", dst: any, dst_port: "1024-65535"}
    - {acl: v6-sample-in, seq: 30, action: permit, protocol: icmp, src: any, dst: any, icmp_type: neighbor-solicitation}
    - {acl: v6-sample-in, seq: 40, action: permit, protocol: icmp, src: any, dst: any, icmp_type: "134"}
    - {acl: v6-sample-in, seq: 50, action: permit, protocol: "50", src: "2001:db8:1::/48", dst: any, dscp: 46}
    - {acl: v6-sample-in, seq: 60, action: deny, protocol: ip, src: any, dst: any, flags: [fragments]}
  ipv6_prefix_lists:
    - {name: pl6-sample, seq: 5, action: permit, prefix: "2001:db8::/32", ge: 48, le: 64}
    - {name: pl6-sample, seq: 10, action: deny, prefix: "::/0", le: 128}
  ospfv3_processes:
    - {process_id: 1, router_id: 192.0.2.1, default_originate: when_present, default_metric: 10, redistribute: [connected, static]}
  ospfv3_interfaces:
    - {process_id: 1, if_name: GigaEthernet2.0, area: "0", cost: 20, priority: 100, hello: 5, dead: 20}
    - {process_id: 1, if_name: Loopback0.0, area: "1", passive: true}
  ospfv3_areas:
    - {process_id: 1, area: "1", type: totally_stub, default_cost: 5, ranges: ["2001:db8:0:10::/60"], ranges_hidden: ["2001:db8:0:20::/60"]}
  tunnels:
    - {if_name: Tunnel0.0, type: ipv4_over_ipv6, source: GigaEthernet0.0, destination_fqdn: aftr.example.jp}
    - {if_name: Tunnel1.0, type: map_e, provider: ocn_fixed, provider_host: sample-host.example.jp}
    - {if_name: Tunnel2.0, type: auto_ds_lite, lan_if: GigaEthernet1.0}
    - {if_name: Tunnel3.0, type: ipv4_over_ipv6, source: "2001:db8:0:1::1", destination_v6: "2001:db8:ffff::1"}
findings: [G-614]
