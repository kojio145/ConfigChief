# IPsec, the third round (made-up values; appendix A 3.20 and 3.26).
# expect.txt is the configuration the tables must turn into: keys in the
# form the device saved them ("secret <value>": written back with "key-type
# secret 1" and "key secret"), and the ESP hash "none" of IKE version 2
# ("child-proposal integrity off").
tables:
  devices:
    - hostname: ix-v02
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.9/29}
    - {name: Tunnel0.0, enabled: true, ipv4: "unnumbered:GigaEthernet0.0"}
    - {name: Tunnel1.0, enabled: true, ipv4: "unnumbered:GigaEthernet0.0"}
  tunnels:
    - {if_name: Tunnel0.0, type: ipsec}
    - {if_name: Tunnel1.0, type: ipsec, source: GigaEthernet0.0, destination: 203.0.113.30}
  ipsec_tunnels:
    - {name: Tunnel0.0, style: tunnel_if, tunnel_if: Tunnel0.0, peer_address: 203.0.113.20, ike_version: 1, psk: "secret DUMMYENCSAMPLEAAAA", ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 28800, esp_encryption: aes256, esp_hash: sha256, pfs: none, ipsec_lifetime: 28800}
    - {name: Tunnel1.0, style: tunnel_if, tunnel_if: Tunnel1.0, peer_address: 203.0.113.30, ike_version: 2, psk: "secret DUMMYENCSAMPLEBBBB", psk_remote: "secret DUMMYENCSAMPLECCCC", ike_lifetime: 86400, esp_encryption: aes256, esp_hash: none, ipsec_lifetime: 28800}
