# community list), and "send the communities" has no line here. The weight is
# not of this device: it is told as a value that is not written (G-602).
# Made-up values.
tables:
  devices:
    - hostname: ix-r07
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.1/30}
  bgp_processes:
    - {asn: 64496, router_id: 192.0.2.1}
  bgp_neighbors:
    - {neighbor: 203.0.113.2, remote_as: 64497, send_community: true, filter_in: rm-r-in}
