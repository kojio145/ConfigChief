# The rest of the built-in switch and of bridging (appendix A 3.22,
# 2026-11-21; made-up values).
tables:
  devices:
    - hostname: ix-m02
      vendor: nec_ix
  l2_settings:
    - {bridge_irb: true, bvi_count: 16, loop_detect_interval: 60, loop_detect_threshold: 100, loop_detect_window: 5}
  bridge_groups:
    - {group: 1, aging_time: 100, table_size: 5000, bridge_ipv6: false}
    - {group: 2, table_size: unlimited, bridge_only_pppoe: true}
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.2/30, speed: 2500, mdi: mdix, max_subinterfaces: 64}
    - {name: GigaEthernet0.1, enabled: true, encap_vlan: 10, dot1q_min_frame: 64, bridge_group: 1, bridge_protected: true, bridge_table_size: 2}
    - {name: GigaEthernet2.0, enabled: false, switch_qos_scheduler: wfq, switch_router_priority: 7}
    - {name: "GigaEthernet2:1.0", enabled: true, bridge_group: 1, loop_detect: true, loop_detect_action: none, loop_detect_restore: 100, vlan_id: 1}
    - {name: "GigaEthernet2:4.0", enabled: false, vlan_id: 4}
    - {name: "GigaEthernet2:port1", enabled: true, mdi: mdi, qos_default_priority: 4}
    - {name: "GigaEthernet2:port2", enabled: true}
    - {name: "GigaEthernet2:port4", enabled: true}
    - {name: BVI0, enabled: true, ipv4: 192.0.2.1/25, bridge_group: 1}
  switchports:
    - {if_name: "GigaEthernet2:port1", mode: access, access_vlan: 1}
    - {if_name: "GigaEthernet2:port2", mode: access, access_vlan: 1}
    - {if_name: "GigaEthernet2:port4", mode: access, access_vlan: 4}
  mirror_sessions:
    - {session: 4, sources_both: ["GigaEthernet2:port1"], sources_tx: ["GigaEthernet2:port2"], destination_if: "GigaEthernet2:port4"}
findings: []
