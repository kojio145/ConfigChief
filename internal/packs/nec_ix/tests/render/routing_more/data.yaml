# The rest of the route maps and of OSPF (appendix A 3.19, the part added
# on 2026-11-21). One distance for every OSPF route is written kind by kind
# (the same thing; nothing is told). Made-up values.
tables:
  devices:
    - hostname: ix-m02
      vendor: nec_ix
      local_policy_route_v6: rm-m-pbr6
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.1/29}
    - {name: GigaEthernet1.0, enabled: true, ipv4: 198.51.100.1/24, ipv6: ["2001:db8:0:10::1/64"]}
  ipv6_interfaces:
    - {if_name: GigaEthernet1.0, tcp_mss: auto, policy_route: rm-m-pbr6}
  ospf_processes:
    - {process_id: 1, router_id: 192.0.2.1, distance_intra: 100, distance_inter: 105, distance_external: 120, filter_in_prefix_list: pl-m-ospf, default_originate: always, default_metric: 50, default_metric_type: "1", default_filter: rm-m-def}
    - {process_id: 2, router_id: 192.0.2.2, filter_in_policy: rm-m-def, distance: 115}
  ospf_interfaces:
    - {process_id: 1, if_name: GigaEthernet1.0, area: "0", hello: 10, dead: 40}
  ospf_virtual_links:
    - {process_id: 1, area: "1", router_id: 192.0.2.9}
    - {process_id: 1, area: "2", router_id: 192.0.2.10, hello: 5, dead: 20}
