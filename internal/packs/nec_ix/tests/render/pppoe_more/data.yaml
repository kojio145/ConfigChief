# The rest of PPPoE, appendix A 3.26 (made-up values): a profile that asks
# the peer too, a line that is called on demand with its idle time, and the
# PPPoE server on the interfaces under a LAC.
tables:
  devices:
    - hostname: ix-e12
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true}
    - {name: GigaEthernet0.1, enabled: true, ipv4: negotiated}
    - {name: GigaEthernet0.2, enabled: true, ipv4: negotiated}
    - {name: GigaEthernet2.0, enabled: true, ipv4: 198.51.100.129/25}
    - {name: GigaEthernet2.1, enabled: true, ipv4: "unnumbered:GigaEthernet2.0"}
    - {name: GigaEthernet2.2, enabled: true, ipv4: "unnumbered:GigaEthernet2.0"}
    - {name: Tunnel1.0, enabled: true}
  pppoe:
    - {name: ppp-sample-a, physical_if: GigaEthernet0.0, logical_if: GigaEthernet0.1, username: example-user@example.net, password: dummy-ppp-password-a, auth: chap, auth_both: true}
    - {name: ppp-sample-b, physical_if: GigaEthernet0.0, logical_if: GigaEthernet0.2, username: sample-user@example.net, password: dummy-ppp-password-b, auth: chap_pap, on_demand: true, idle_timeout: 300}
  l2tp_groups:
    - {name: lac-sample, role: lac, peer_address: 203.0.113.50, tunnel_auth: false, domains: [example.net], logical_ifs: [Tunnel1.0], access_ifs: [GigaEthernet2.1, GigaEthernet2.2], auth: chap_pap, idle_timeout: 120}
