# IPv6 VRRP (version 3; appendix A 3.23, "IPv6 の VRRP"; made-up values): an
# IPv4 group and two IPv6 groups (whole seconds and centiseconds).
tables:
  devices:
    - {hostname: ix-w02, vendor: nec_ix}
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 192.0.2.3/24, ipv6: ["2001:db8:0:1::3/64"]}
    - {name: GigaEthernet1.0, enabled: true, ipv6: ["2001:db8:0:2::3/64"]}
  fhrp:
    - {if_name: GigaEthernet0.0, group: 1, protocol: vrrp, virtual_ip: 192.0.2.1, priority: 90, preempt: true}
  ipv6_fhrp:
    - {if_name: GigaEthernet0.0, group: 2, link_local: "fe80::1", addresses: ["2001:db8:0:1::1"], priority: 90, preempt: false, advert_interval: 1500}
    - {if_name: GigaEthernet1.0, group: 3, link_local: "fe80::3", priority: 100, preempt: true, advert_interval: 2000}
