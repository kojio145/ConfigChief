# The candidates of IPsec (made-up values; appendix A 3.20). expect.txt is
# the configuration the tables must turn into. The row of IKE version 2 has
# its lists of values, and the further candidates another vendor writes as
# rows (a second IKEv2 proposal, a second transform set): their values join
# the lists, which is told. The row of version 1 names six proposals,
# numbered as a person may number them: only their order counts.
tables:
  devices:
    - hostname: ix-h02
      vendor: nec_ix
  interfaces:
    - {name: GigaEthernet0.0, enabled: true, ipv4: 203.0.113.9/29}
    - {name: Tunnel0.0, enabled: true, ipv4: "unnumbered:GigaEthernet0.0"}
    - {name: Tunnel1.0, enabled: true, ipv4: "unnumbered:GigaEthernet0.0"}
  tunnels:
    - {if_name: Tunnel0.0, type: ipsec, source: GigaEthernet0.0, destination: 203.0.113.20}
    - {if_name: Tunnel1.0, type: ipsec}
  ipsec_tunnels:
    - {name: Tunnel0.0, style: tunnel_if, tunnel_if: Tunnel0.0, peer_address: 203.0.113.20, ike_version: 2, psk: dummy-psk-sample-a, ike_encryption: aes256, ike_encryption_more: [aes192], ike_hash: sha512, ike_hash_more: [sha256], ike_dh: dh14, ike_prf: sha512, ike_lifetime: 86400, esp_encryption: aes256, esp_hash: sha256, pfs: dh14, pfs_more: [dh5], ipsec_lifetime: 28800}
    - {name: Tunnel1.0, style: tunnel_if, tunnel_if: Tunnel1.0, peer_address: 203.0.113.30, ike_version: 1, psk: dummy-psk-sample-b, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 28800, esp_encryption: aes256, esp_hash: sha1}
  ipsec_proposals:
    - {tunnel: Tunnel0.0, phase: ike, seq: 20, encryption: aes128, hash: sha1, dh: dh5}
    - {tunnel: Tunnel0.0, phase: ipsec, seq: 20, encryption: aes128, hash: sha1}
    - {tunnel: Tunnel1.0, phase: ike, seq: 15, encryption: aes128, hash: sha1, dh: dh2}
    - {tunnel: Tunnel1.0, phase: ipsec, seq: 15, encryption: aes192, hash: sha1}
    - {tunnel: Tunnel1.0, phase: ipsec, seq: 25, encryption: aes128, hash: sha1}
    - {tunnel: Tunnel1.0, phase: ipsec, seq: 35, encryption: 3des, hash: sha1}
    - {tunnel: Tunnel1.0, phase: ipsec, seq: 45, encryption: aes256, hash: sha256}
    - {tunnel: Tunnel1.0, phase: ipsec, seq: 55, encryption: aes128, hash: sha256}
findings: [G-614]
