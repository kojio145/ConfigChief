    # No selector; the peer is not an address; the interface is not on the sheet.
    - {name: CMAP-SAMPLE/10, style: policy, local_if: GigabitEthernet0/9, peer_address: any, psk: dummy-psk-sample-d, ike_version: 1, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 28800, esp_encryption: aes256, esp_hash: sha1, pfs: none, ipsec_lifetime: 3600}
