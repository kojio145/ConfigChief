# IPv6 (appendix A 3.23; made-up values): addresses, static routes, access
# lists, prefix lists, OSPFv3, BGP, router advertisements, DHCPv6 and a
# tunnel over IPv6. expect.txt is the configuration the tables must turn into.
tables:
  devices:
    - hostname: rt-v01
      vendor: cisco_ios
      ipv6_routing: true
  interfaces:
    - {name: GigabitEthernet0/0, enabled: true, description: WAN sample, ipv6: ["2001:db8:0:1::1/64"]}
    - {name: GigabitEthernet0/1, enabled: true, description: LAN sample, ipv6: ["2001:db8:0:10::1/64"]}
    - {name: GigabitEthernet0/2, enabled: true, description: IPoE sample}
    - {name: GigabitEthernet0/3, enabled: true, description: LAN of the delegated prefix}
    - {name: Loopback0, enabled: true, ipv4: 192.0.2.1/32, ipv6: ["2001:db8::1/128"]}
    - {name: Tunnel1, enabled: true, ipv4: 192.0.2.209/30}
  ipv6_interfaces:
    - {if_name: GigabitEthernet0/0, link_local: "fe80::1", acl_in: V6-SAMPLE-IN, ra: "off", mtu: 1500}
    - if_name: GigabitEthernet0/1
      eui64: ["2001:db8:0:11::/64"]
      anycast: ["2001:db8:0:12::1/64"]
      ra: send
      ra_interval: 200
      ra_interval_min: 50
      ra_lifetime: 1800
      ra_other: true
      ra_dns: ["2001:db8::53", "2001:db8::54"]
      ra_dns_lifetime: 600
      dhcp_server: pool-sample-v6
      dhcp_dns: ["2001:db8::53", dhcp]
      dhcp_domain: example.com
    - {if_name: GigabitEthernet0/2, enabled: true, autoconfig: true, autoconfig_default: true, pd_request: pd-sample, rapid_commit: true}
    - {if_name: GigabitEthernet0/3, pd_from: pd-sample, pd_suffix: "::1/64", ra: reply_only, ra_managed: true}
  ipv6_ra_prefixes:
    - {if_name: GigabitEthernet0/1, prefix: "2001:db8:0:10::/64", valid_lifetime: 86400, preferred_lifetime: 14400, on_link: true, autonomous: false}
    - {if_name: GigabitEthernet0/1, prefix: "2001:db8:0:11::/64", valid_lifetime: 2592000, preferred_lifetime: 604800, on_link: false, autonomous: true}
  ipv6_routes:
    - {prefix: "::/0", next_hop: "2001:db8:0:1::2"}
    - {prefix: "2001:db8:100::/48", next_hop: "fe80::2", out_if: GigabitEthernet0/0, distance: 10, description: to-sample}
    - {prefix: "2001:db8:200::/48", out_if: Null0}
  ipv6_acl_entries:
    - {acl: V6-SAMPLE-IN, seq: 10, action: remark, remark: sample filter}
    - {acl: V6-SAMPLE-IN, seq: 20, action: permit, protocol: tcp, src: any, dst: "2001:db8:0:10::/64", dst_port: "443", flags: [established]}
    - {acl: V6-SAMPLE-IN, seq: 30, action: permit, protocol: udp, src: "2001:db8::53", src_port: "53", dst: any, dst_port: "1024-65535"}
    - {acl: V6-SAMPLE-IN, seq: 40, action: permit, protocol: icmp, src: any, dst: any, icmp_type: neighbor-solicitation}
    - {acl: V6-SAMPLE-IN, seq: 50, action: permit, protocol: icmp, src: any, dst: any, icmp_type: "134"}
    - {acl: V6-SAMPLE-IN, seq: 60, action: deny, protocol: ip, src: any, dst: any, flags: [log]}
    - {acl: V6-SAMPLE-NUM, seq: 5, action: permit, protocol: ip, src: "2001:db8:1::/48", dst: any, dscp: 46}
    - {acl: V6-SAMPLE-NUM, seq: 100, action: deny, protocol: esp, src: any, dst: "2001:db8::1"}
  ipv6_prefix_lists:
    - {name: PL6-SAMPLE, seq: 5, action: permit, prefix: "2001:db8::/32", ge: 48, le: 64}
    - {name: PL6-SAMPLE, seq: 10, action: deny, prefix: "::/0", le: 128}
  ospfv3_processes:
    - {process_id: 1, router_id: 192.0.2.1, default_originate: always, default_metric: 10, redistribute: [connected, static, bgp]}
  ospfv3_interfaces:
    - {process_id: 1, if_name: GigabitEthernet0/0, area: "0", cost: 20, priority: 100, hello: 5, dead: 20, network_type: point_to_point}
    - {process_id: 1, if_name: GigabitEthernet0/1, area: "1", passive: true}
  ospfv3_areas:
    - {process_id: 1, area: "1", type: totally_stub, default_cost: 5, ranges: ["2001:db8:0:10::/60"], ranges_hidden: ["2001:db8:0:20::/60"]}
  bgp_processes:
    - {asn: 64496, router_id: 192.0.2.1, ipv6_networks: ["2001:db8:10::/48"], ipv6_redistribute: [static, ospf]}
  bgp_ipv6_neighbors:
    - neighbor: "2001:db8:0:1::2"
      remote_as: 64497
      description: sample upstream
      password: Example-Secret-6
      ebgp_multihop: 2
      update_source: Loopback0
      next_hop_self: true
      soft_reconfig_in: true
      prefix_list_in: PL6-SAMPLE
      filter_out: RM-SAMPLE-OUT
    - {neighbor: "2001:db8:0:1::3", remote_as: 64496, enabled: false}
  tunnels:
    - {if_name: Tunnel1, type: ipv4_over_ipv6, source: GigabitEthernet0/0, destination_v6: "2001:db8:ffff::1"}
