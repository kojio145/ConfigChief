# QoS this device cannot write (made-up values; appendix A 3.26): each
# tells why, and how it is put right.
tables:
  devices:
    - hostname: rt-q23
      vendor: cisco_ios
  interfaces:
    - {name: GigabitEthernet0/0, enabled: true, ipv4: 203.0.113.25/30}
  qos_classes:
    - {name: cm-f-a, match: any}
  qos_class_matches:
    # Conditions of another vendor.
    - {class: cm-f-a, seq: 10, local_generated: true}
    # Two conditions on a row.
    - {class: cm-f-a, seq: 20, cos: [1], qos_group: 5}
    # "not" with nothing to turn round; a group out of the range.
    - {class: cm-f-a, seq: 30, negate: true}
    - {class: cm-f-a, seq: 40, qos_group: 200}
  qos_policies:
    # Percent and bps together; a mode without a rate.
    - {policy: pm-f-out, class: cm-f-a, seq: 10, shape_percent: 30, shape_bps: 1000000, police_violate: drop, queue_limit: [64], random_detect: "on"}
    # A class of another vendor.
    - {policy: pm-f-out, class: dynamic, seq: 20, set_cos: 1}
    - {policy: pm-f-out, class: default, seq: 30, shape_mode: peak, queue_limit_unit: bytes, set_qos_group: 500}
  qos_bindings:
    - {if_name: GigabitEthernet0/0, direction: output, policy: pm-f-out}
findings: [G-601]
