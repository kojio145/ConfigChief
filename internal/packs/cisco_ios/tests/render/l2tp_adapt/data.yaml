# L2TP rows the pack writes in its own way (made-up values; appendix A 3.21,
# adapt.yaml): a pseudowire class without a name gets one; the name of the
# IPsec setting of an LNS and the tunnel interface of a LAC, which another
# vendor needs, are not written. Each is told as G-614.
tables:
  devices:
    - hostname: rt-c03
      vendor: cisco_ios
  interfaces:
    - {name: Loopback0, enabled: true, ipv4: 203.0.113.1/32}
    - {name: GigabitEthernet0/1, enabled: true}
    - {name: Virtual-Template1, enabled: true, ipv4: "unnumbered:Loopback0"}
  l2tpv3:
    - {if_name: GigabitEthernet0/1, peer_address: 203.0.113.2, vc_id: 101, local_if: Loopback0, signaling: dynamic}
  l2tp_groups:
    - {name: lac-sample, role: lac, logical_ifs: [Tunnel2], peer_address: 198.51.100.1, tunnel_auth: true, password: dummy-l2tp-secret-c, domains: [example.com]}
    - {name: lns-sample, role: lns, logical_ifs: [Virtual-Template1], tunnel_auth: false, auth: chap, pool_start: 192.0.2.131, pool_end: 192.0.2.190, ipsec_policy: ipsec-sample-ra}
findings: [G-614]
