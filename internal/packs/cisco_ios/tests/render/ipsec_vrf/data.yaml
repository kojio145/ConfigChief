# IPsec, the third round (made-up values; appendix A 3.20). expect.txt is
# the configuration the tables must turn into: a row with the peer "any" on
# a virtual template (IKE version 1: a keyring and an ISAKMP profile that
# names the template; version 2: the IKEv2 profile names it), a tunnel whose
# peer is a name, and rows with an outer VRF ("tunnel vrf", a keyring with
# "vrf", "match fvrf") and an inner VRF (the VRF of the tunnel interface;
# "vrf" of the ISAKMP profile and "ivrf" of the IKEv2 profile for the
# entries of a crypto map).
tables:
  devices:
    - hostname: rt-v01
      vendor: cisco_ios
      domain_name: example.com
  vrfs:
    - {name: wan-a}
    - {name: cust-a}
    - {name: cust-b}
  interfaces:
    - {name: Loopback0, enabled: true, ipv4: 192.0.2.1/32}
    - {name: GigabitEthernet0/0, enabled: true, ipv4: 203.0.113.9/29}
    - {name: GigabitEthernet0/1, enabled: true, vrf: wan-a, ipv4: 203.0.113.17/29}
    - {name: Tunnel1, enabled: true, ipv4: 198.51.100.1/30}
    - {name: Tunnel2, enabled: true, vrf: cust-a, ipv4: 198.51.100.5/30}
    - {name: Tunnel3, enabled: true, vrf: cust-a, ipv4: 198.51.100.9/30}
    - {name: Virtual-Template1, enabled: true, ipv4: "unnumbered:Loopback0"}
    - {name: Virtual-Template2, enabled: true, ipv4: "unnumbered:Loopback0"}
  tunnels:
    - {if_name: Tunnel1, type: ipsec, source: GigabitEthernet0/0}
    - {if_name: Tunnel2, type: ipsec, source: GigabitEthernet0/1, destination: 203.0.113.50}
    - {if_name: Tunnel3, type: ipsec, source: GigabitEthernet0/1, destination: 203.0.113.70}
    - {if_name: Virtual-Template1, type: ipsec}
    - {if_name: Virtual-Template2, type: ipsec, source: GigabitEthernet0/0}
  ipsec_tunnels:
    - {name: Tunnel1, style: tunnel_if, tunnel_if: Tunnel1, peer_address: rt-v09.example.com, ike_version: 1, psk: dummy-psk-sample-name, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 86400, esp_encryption: aes256, esp_hash: sha256, pfs: none, ipsec_lifetime: 3600}
    - {name: Tunnel2, style: tunnel_if, tunnel_if: Tunnel2, peer_address: 203.0.113.50, ike_version: 1, psk: dummy-psk-sample-wan, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 86400, esp_encryption: aes256, esp_hash: sha256, pfs: none, ipsec_lifetime: 3600, outer_vrf: wan-a}
    - {name: Tunnel3, style: tunnel_if, tunnel_if: Tunnel3, peer_address: 203.0.113.70, ike_version: 2, psk: dummy-psk-sample-v2wan, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 86400, esp_encryption: aes256, esp_hash: sha256, pfs: none, ipsec_lifetime: 3600, outer_vrf: wan-a}
    - {name: Virtual-Template1, style: tunnel_if, tunnel_if: Virtual-Template1, peer_address: any, ike_version: 1, psk: dummy-psk-sample-vt, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 86400, esp_encryption: aes256, esp_hash: sha256, pfs: none, ipsec_lifetime: 3600}
    - {name: Virtual-Template2, style: tunnel_if, tunnel_if: Virtual-Template2, peer_address: any, ike_version: 2, psk: dummy-psk-sample-v2any, local_id: "fqdn:rt-v01.example.com", remote_id: "fqdn:rt-v08.example.com", ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 86400, esp_encryption: aes256, esp_hash: sha256, pfs: none, ipsec_lifetime: 3600}
    - {name: CMAP-SAMPLE/10, style: policy, local_if: GigabitEthernet0/1, peer_address: 203.0.113.60, ike_version: 1, psk: dummy-psk-sample-map, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 86400, esp_encryption: aes256, esp_hash: sha256, pfs: none, ipsec_lifetime: 3600, outer_vrf: wan-a, inner_vrf: cust-b}
    - {name: CMAP-SAMPLE/20, style: policy, local_if: GigabitEthernet0/1, peer_address: 203.0.113.61, ike_version: 2, psk: dummy-psk-sample-map2, ike_encryption: aes256, ike_hash: sha256, ike_dh: dh14, ike_lifetime: 86400, esp_encryption: aes256, esp_hash: sha256, pfs: none, ipsec_lifetime: 3600, outer_vrf: wan-a, inner_vrf: cust-b}
  ipsec_selectors:
    - {tunnel: CMAP-SAMPLE/10, seq: 10, local_net: 192.0.2.128/25, remote_net: 198.51.100.128/25, protocol: ip}
    - {tunnel: CMAP-SAMPLE/20, seq: 10, local_net: 192.0.2.128/25, remote_net: 198.51.100.0/25, protocol: ip}
