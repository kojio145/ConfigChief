# L2TP (made-up values; appendix A 3.21). expect.txt is the configuration the
# tables must turn into: two attachment circuits of L2TPv3 that share a
# pseudowire class, one set by hand, an LNS with its Virtual-Template, its
# pool and its callers, and a LAC.
tables:
  devices:
    - hostname: rt-c01
      vendor: cisco_ios
  interfaces:
    - {name: Loopback0, enabled: true, ipv4: 203.0.113.1/32}
    - {name: GigabitEthernet0/0, description: sample-wan, enabled: true, ipv4: 203.0.113.9/30}
    - {name: GigabitEthernet0/1, description: sample-l2-a, enabled: true}
    - {name: GigabitEthernet0/2, enabled: true}
    - {name: GigabitEthernet0/2.10, description: sample-l2-b, enabled: true, encap_vlan: 10}
    - {name: GigabitEthernet0/3, description: sample-l2-c, enabled: true}
    - {name: Virtual-Template1, enabled: true, ipv4: "unnumbered:Loopback0"}
  l2tpv3:
    - {if_name: GigabitEthernet0/1, peer_address: 203.0.113.2, vc_id: 101, profile: PW-SAMPLE-A, local_if: Loopback0, signaling: dynamic, password: dummy-l2tpv3-secret-a, local_name: rt-c01, hello: 30, sequencing: both, pmtu: true, df_bit: true}
    - {if_name: GigabitEthernet0/2.10, peer_address: 203.0.113.2, vc_id: 102, profile: PW-SAMPLE-A, local_if: Loopback0, signaling: dynamic, password: dummy-l2tpv3-secret-a, local_name: rt-c01, hello: 30, sequencing: both, pmtu: true, df_bit: true}
    - {if_name: GigabitEthernet0/3, peer_address: 203.0.113.3, vc_id: 201, profile: PW-SAMPLE-M, local_if: Loopback0, signaling: manual, local_session_id: 222, remote_session_id: 111, local_cookie: "4 54321", remote_cookie: "8 12345 67890", hello: 60}
  l2tp_groups:
    - {name: LAC-SAMPLE, role: lac, peer_address: 198.51.100.1, local_name: rt-c01, tunnel_auth: true, password: dummy-l2tp-secret-c, domains: [example.com, example.net]}
    - {name: RA-SAMPLE, role: lns, logical_ifs: [Virtual-Template1], tunnel_auth: false, auth: mschap_v2, pool_start: 192.0.2.100, pool_end: 192.0.2.150, dns_servers: [192.0.2.53, 192.0.2.54]}
  l2tp_users:
    - {group: RA-SAMPLE, name: example-user, password: dummy-l2tp-user-secret-1}
    - {group: RA-SAMPLE, name: sample-user, password: dummy-l2tp-user-secret-2}
