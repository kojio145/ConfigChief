# The DHCP server and tunnels (made-up values). expect.txt is the
# configuration the tables must turn into.
tables:
  devices:
    - hostname: rt-t01
      vendor: cisco_ios
  interfaces:
    - {name: GigabitEthernet0/0, enabled: true, ipv4: 203.0.113.57/30}
    - {name: GigabitEthernet0/1, enabled: true, ipv4: 198.51.100.1/24}
    - {name: Tunnel1, enabled: true, ipv4: 192.0.2.209/30}
    - {name: Tunnel2, enabled: true, ipv4: 192.0.2.213/30}
  tunnels:
    - {if_name: Tunnel1, type: gre, source: GigabitEthernet0/0, destination: 203.0.113.61, key: 100, keepalive_interval: 10, keepalive_retry: 3}
    - {if_name: Tunnel2, type: ipip, source: 203.0.113.57, destination: 203.0.113.65}
  dhcp_pools:
    - name: pool-sample-lan
      network: 198.51.100.0/24
      excluded: [198.51.100.1-198.51.100.10, 198.51.100.254-198.51.100.254]
      default_router: 198.51.100.1
      dns_servers: [192.0.2.53, 192.0.2.54]
      domain: example.com
      lease: 36h
    - {name: pool-sample-guest, network: 192.0.2.0/26, lease: 2d}
    - {name: pool-sample-plain, network: 192.0.2.64/26}
