# The rest of PPPoE, appendix A 3.26 (made-up values): the words after the
# pool number, a service name in quotation marks, "ppp authentication"
# without "callin", what starts a call, a password in the encrypted form of
# the device, and the ports that take PPPoE for a LAC.
tables:
  pppoe:
    - name: Dialer1
      physical_if: GigabitEthernet0/0
      logical_if: Dialer1
      username: example-user@example.net
      password: "7 dummy7sample1A2B3C"
      auth: chap
      auth_both: true
      service_name: sample service a
      on_demand: true
      restart_delay: 30
      mac_override: true
      dial_trigger: ip
    - name: Dialer2
      physical_if: GigabitEthernet0/1
      logical_if: Dialer2
      username: sample-user@example.net
      auth: pap
      auth_both: ""
      service_name: sample-b
      dial_trigger: 10
  l2tp_groups:
    - {name: lac-sample, role: lac, peer_address: 203.0.113.50, domains: [example.net], access_ifs: [GigabitEthernet0/2], logical_ifs: [Virtual-Template1], auth: chap}
# A limit of the group of PPPoE has no column.
unknown:
  - "sessions max limit 100"
ignored_min: 3
