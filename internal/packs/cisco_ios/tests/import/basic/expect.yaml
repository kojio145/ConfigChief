# What the sample must turn into. "tables" lists some rows per table (not all
# of them); "unknown" is the whole list of lines that may stay unknown.
tables:
  devices:
    - hostname: rt-a01
      vendor: cisco_ios
      domain_name: example.com
      name_servers: [192.0.2.53, 192.0.2.54]
      timezone: JST +9
      secret_form: hashed
      snmp_location: sample-site-a rack 1
      snmp_contact: netops@example.com
      banner: "sample banner: authorized access only"
      log_timestamp: datetime
      log_timestamp_options: [msec]
      debug_timestamp: datetime
      debug_timestamp_options: [msec]
      password_encryption: false
      console_timeout: 5
  interfaces:
    - {name: Loopback0, kind: loopback, ipv4: 192.0.2.1/32, enabled: true}
    - {name: Tunnel1, kind: tunnel, ipv4: 198.18.0.1/30, ip_mtu: 1400, tcp_mss: 1360}
    - {name: GigabitEthernet0/0, kind: physical, ipv4: "", speed: auto, duplex: auto}
    - name: GigabitEthernet0/1
      ipv4: 198.51.100.2/24
      ipv4_secondary: [203.0.113.129/25]
      acl_in: ACL-SAMPLE-IN
      nat_role: inside
      dhcp_relay: [192.0.2.67]
      proxy_arp: false
      speed: 1000
      duplex: full
    - {name: GigabitEthernet0/2, ipv4: 203.0.113.1/30, bandwidth: 100000, acl_out: ACL-SAMPLE-OUT}
    - {name: GigabitEthernet0/3.10, kind: subif, encap_vlan: 10, ipv4: 192.0.2.130/25}
    - {name: GigabitEthernet0/3.20, kind: subif, encap_vlan: 20, vrf: VRF-SAMPLE-A, ipv4: 192.0.2.193/26}
    - {name: GigabitEthernet0/4, enabled: false}
    - {name: Dialer1, kind: dialer, ipv4: negotiated, ip_mtu: 1454, tcp_mss: 1414, nat_role: outside}
  static_routes:
    - {prefix: 0.0.0.0/0, out_if: Dialer1}
    - {prefix: 192.0.2.64/26, next_hop: 203.0.113.2, distance: 10, track: 1, description: sample-backup}
    - {prefix: 198.18.20.0/24, out_if: Tunnel1}
    - {vrf: VRF-SAMPLE-A, prefix: 198.18.10.0/24, next_hop: 192.0.2.194}
  users:
    - {name: admin, privilege: admin, secret_form: hashed}
    - {name: backup, secret: dummy-backup-password, secret_form: plain, reversible: true}
  remote_access:
    - {protocols: [ssh], ssh_version: 2, acl: 10, idle_timeout: 10, auth: local}
  ntp_servers:
    - {server: 192.0.2.123, prefer: true, source_if: Loopback0}
    - {server: 192.0.2.124, source_if: Loopback0}
  syslog_servers:
    - {server: 192.0.2.50, facility: local6, severity: warnings, source_if: Loopback0}
  snmp_communities:
    - {community: dummy-ro-comm, access: ro, acl: 10}
  snmp_hosts:
    - {host: 192.0.2.60, version: 2c, community: dummy-ro-comm, source_if: Loopback0}
  vrfs:
    - {name: VRF-SAMPLE-A, rd: "64496:100", description: sample vrf a}
    - {name: VRF-SAMPLE-B, rd: "64496:200"}
  ospf_processes:
    - process_id: 1
      router_id: 192.0.2.1
      reference_bandwidth: 10000
      passive_default: true
      default_originate: always
  ospf_interfaces:
    - {process_id: 1, if_name: Loopback0, area: 0}
    - {process_id: 1, if_name: GigabitEthernet0/1, area: 1, cost: 10, priority: 100}
    - process_id: 1
      if_name: GigabitEthernet0/2
      area: 0
      network_type: point_to_point
      hello: 5
      dead: 20
      passive: false
      auth_type: md5
      auth_key_id: 1
      auth_key: dummy-ospf-key
  ospf_areas:
    - {process_id: 1, area: 1, type: totally_stub}
  ospf_ranges:
    - {process_id: 1, area: 1, prefix: 198.51.100.0/24}
  ospf_redistribute:
    - {process_id: 1, source: static, metric: 100, metric_type: 1}
  bgp_processes:
    - {asn: 64496, router_id: 192.0.2.1, log_neighbor_changes: true}
  bgp_neighbors:
    - {neighbor: 192.0.2.2, remote_as: 64496, update_source: Loopback0, enabled: false, next_hop_self: true}
    - neighbor: 203.0.113.2
      remote_as: 64497
      description: to rt-b01
      password: dummy-bgp-key
      soft_reconfig_in: true
      prefix_list_in: PL-SAMPLE-IN
      prefix_list_out: PL-SAMPLE-OUT
    - {neighbor: 203.0.113.30, remote_as: 64498, ebgp_multihop: 2}
  bgp_networks:
    - {prefix: 198.51.100.0/24}
  bgp_redistribute:
    - {source: connected}
  fhrp:
    - if_name: GigabitEthernet0/1
      group: 1
      protocol: hsrp
      version: 2
      virtual_ip: 198.51.100.1
      priority: 110
      preempt: true
      preempt_delay: 60
      auth_type: simple
      auth_key: dummy-hsrp
      track: 1
      track_decrement: 20
    - if_name: GigabitEthernet0/3.10
      group: 10
      protocol: vrrp
      virtual_ip: 192.0.2.129
      priority: 120
      preempt: true
      preempt_delay: 30
      advert_interval: 3
  acls:
    - {name: ACL-SAMPLE-MGMT, type: standard}
    - {name: ACL-SAMPLE-IN, type: extended}
    - {name: "10", type: standard}
    - {name: "100", type: extended}
  acl_entries:
    - {acl: ACL-SAMPLE-MGMT, seq: 10, action: permit, src: 192.0.2.0/24}
    - {acl: ACL-SAMPLE-IN, seq: 10, action: remark, remark: sample inbound filter}
    - {acl: ACL-SAMPLE-IN, seq: 20, action: permit, protocol: tcp, src: 198.51.100.0/24, dst: any, dst_port: 443}
    - {acl: ACL-SAMPLE-IN, seq: 30, action: permit, protocol: tcp, src: any, dst: 192.0.2.80, dst_port: 8000-8080}
    - {acl: ACL-SAMPLE-IN, seq: 50, action: permit, protocol: tcp, flags: [established]}
    - {acl: ACL-SAMPLE-IN, seq: 70, action: deny, protocol: ip, flags: [log]}
    - {acl: ACL-SAMPLE-OUT, seq: 20, action: deny, protocol: ip, src: any, dst: any}
    - {acl: "10", seq: 20, action: deny, src: any, flags: [log]}
    - {acl: "100", seq: 10, action: remark, remark: sample numbered list}
    - {acl: "100", seq: 30, action: deny, protocol: ip}
  prefix_lists:
    - {name: PL-SAMPLE-IN, seq: 5, action: permit, prefix: 0.0.0.0/0}
    - {name: PL-SAMPLE-OUT, seq: 10, action: permit, prefix: 198.51.100.0/24, le: 28}
    - {name: PL-SAMPLE-OUT, seq: 20, action: deny, prefix: 0.0.0.0/0, le: 32}
  nat_rules:
    - {name: nat1, type: pat_interface, match_acl: ACL-SAMPLE-NAT, outside_if: Dialer1}
    - name: nat2
      type: pat_pool
      match_acl: 10
      pool_start: 203.0.113.210
      pool_end: 203.0.113.220
      pool_prefix: 25
    - {name: nat3, type: static, local_ip: 198.51.100.20, global_ip: 203.0.113.200}
    - name: nat4
      type: static_port
      protocol: tcp
      local_ip: 198.51.100.21
      local_port: 443
      global_ip: 203.0.113.201
      global_port: 443
  tracks:
    - id: 1
      type: icmp
      target: 203.0.113.2
      source_if: GigabitEthernet0/2
      interval: 10
      down_delay: 10
    - {id: 2, type: interface, target: GigabitEthernet0/2}
  pppoe:
    - name: Dialer1
      physical_if: GigabitEthernet0/0
      logical_if: Dialer1
      username: example-user@example.net
      password: dummy-ppp-password
      auth: chap
  ipsec_tunnels:
    - name: Tunnel1
      style: tunnel_if
      tunnel_if: Tunnel1
      peer_address: 203.0.113.20
      ike_version: 1
      psk: dummy-psk-sample
      ike_encryption: aes256
      ike_hash: sha256
      ike_dh: dh14
      ike_lifetime: 28800
      esp_encryption: aes256
      esp_hash: sha1
      pfs: dh14
      ipsec_lifetime: 3600
      ipsec_mode: tunnel
      dpd_interval: 30
      dpd_retry_interval: 5
      dpd_mode: on_demand
    - name: CMAP-SAMPLE/10
      style: policy
      tunnel_if: ""
      local_if: Dialer1
      peer_address: 203.0.113.40
      ike_version: 1
      psk: dummy-psk-sample2
      ike_encryption: aes256
      ike_hash: sha256
      ike_dh: dh14
      esp_encryption: aes256
      esp_hash: sha1
      pfs: dh14
  ipsec_selectors:
    - {tunnel: CMAP-SAMPLE/10, seq: 10, local_net: 198.51.100.0/24, remote_net: 192.0.2.128/25, protocol: ip}
    - {tunnel: CMAP-SAMPLE/10, seq: 20, local_net: 198.51.100.0/24, remote_net: 203.0.113.128/25, protocol: ip}
  tunnels:
    - {if_name: Tunnel1, type: ipsec, source: Dialer1, destination: 203.0.113.20}
    - if_name: Tunnel2
      type: gre
      source: Loopback0
      destination: 203.0.113.30
      key: 100
      keepalive_interval: 10
      keepalive_retry: 3
  dhcp_pools:
    - name: POOL-SAMPLE-LAN
      network: 198.51.100.0/24
      default_router: 198.51.100.1
      dns_servers: [192.0.2.53, 192.0.2.54]
      domain: example.com
      lease: 12h
      excluded: [198.51.100.1-198.51.100.10, 198.51.100.254-198.51.100.254]

# Each of these has a reason in README.md ("取り込まない行").
unknown:
ignored_min: 5
