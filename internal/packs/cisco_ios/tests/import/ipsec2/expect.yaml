# The rest of IPsec (appendix A 3.20, made-up values): IKE version 2 on a
# tunnel interface and in a crypto map, a dynamic map for each version, a
# peer by name, an ISAKMP profile with a keyring, AH, the transport mode and
# a lifetime in kilobytes.
tables:
  ipsec_tunnels:
    - name: Tunnel1
      style: tunnel_if
      tunnel_if: Tunnel1
      peer_address: 203.0.113.20
      ike_version: 2
      local_id: ""
      remote_id: ""
      psk: dummy-psk-v2-a
      psk_remote: ""
      ike_encryption: aes256
      ike_hash: sha256
      ike_dh: dh14
      ike_prf: sha384
      ike_lifetime: 43200
      esp_encryption: aes256
      esp_hash: sha1
      ipsec_mode: tunnel
      pfs: dh14
      ipsec_lifetime: 3600
      ipsec_lifetime_kb: 4608000
      dpd_interval: 30
      dpd_retry_interval: 5
      dpd_mode: periodic
    - name: CMAP-SAMPLE/10
      style: policy
      local_if: GigabitEthernet0/0
      peer_address: 203.0.113.30
      ike_version: 2
      local_id: fqdn:rt-c01.example.com
      remote_id: fqdn:rt-c03.example.com
      psk: dummy-psk-v2-b
      psk_remote: dummy-psk-v2-c
      ike_lifetime: 86400
      esp_encryption: aes128
      esp_hash: sha1
      ah_hash: sha1
      ipsec_mode: transport
      pfs: none
      ipsec_lifetime: 7200
      dpd_interval: 60
      dpd_retry_interval: 10
      dpd_mode: on_demand
      nat_keepalive: 20
    - name: CMAP-SAMPLE/20
      style: policy
      peer_address: rt-c06.example.com
      ike_version: 1
      psk: dummy-psk-v1-b
      ike_encryption: aes256
      ike_hash: sha256
      ike_dh: dh14
      ike_lifetime: 86400
      esp_encryption: 3des
      esp_hash: sha1
      ipsec_mode: ""
      dpd_interval: 20
      dpd_retry_interval: 3
      dpd_mode: periodic
      nat_keepalive: 25
    - name: CMAP-SAMPLE/30
      style: policy
      peer_address: 203.0.113.70
      ike_version: 1
      local_id: fqdn:rt-c01.example.com
      remote_id: fqdn:rt-c07.example.com
      psk: dummy-psk-v1-c
      dpd_interval: 15
      dpd_retry_interval: 4
      dpd_mode: on_demand
    - name: CMAP-SAMPLE/80
      style: policy
      peer_address: any
      ike_version: 2
      local_id: keyid:sample-site-c
      remote_id: ""
      psk: 64756d6d792d6b65792d61
      psk_form: hex
      esp_encryption: aes256
    - name: CMAP-SAMPLE/90
      style: policy
      peer_address: any
      ike_version: 1
      psk: dummy-psk-v1-a
      esp_encryption: 3des
      pfs: dh5
  ipsec_selectors:
    - {tunnel: CMAP-SAMPLE/10, seq: 10, local_net: 198.51.100.0/24, remote_net: 192.0.2.0/25, protocol: ip}
    - {tunnel: CMAP-SAMPLE/20, seq: 10, local_net: 198.51.100.0/24, remote_net: 192.0.2.200/32, protocol: ip}
    - {tunnel: CMAP-SAMPLE/30, seq: 10, local_net: 198.51.100.0/24, remote_net: 192.0.2.192/29, protocol: ip}
    - {tunnel: CMAP-SAMPLE/90, seq: 10, local_net: 198.51.100.0/24, remote_net: 192.0.2.128/26, protocol: ip}
  tunnels:
    - {if_name: Tunnel1, type: ipsec, source: GigabitEthernet0/0, destination: 203.0.113.20}
  acls: []
unknown: []
