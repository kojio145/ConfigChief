# The device as a whole, and the management settings (stage M1).
# Syntax: cmdref 4.1 and 4.4.
rules:
  - id: sys.hostname
    match: '^hostname (?P<name>\S+)$'
    row: {table: devices, key: {}}

  # IOS writes "ip domain name", older IOS and IOS-XE "ip domain-name".
  - id: sys.domain
    match: '^ip domain[ -]name (?P<name>\S+)$'
    row: {table: devices, key: {}}
    set: {domain_name: "{{ name }}"}

  # Every server of a device is in the same VRF, or none is (appendix A
  # 3.26): a line that does not agree with the lines before it stays unknown.
  - id: sys.name_server
    match: '^ip name-server (?P<servers>[0-9A-Fa-f:.]+(?: [0-9A-Fa-f:.]+)*)$'
    when: "not first('devices').name_servers_vrf"
    row: {table: devices, key: {}}
    append: {name_servers: "{{ servers }}"}
  - id: sys.name_server.vrf
    match: '^ip name-server vrf (?P<vrf>\S+) (?P<servers>[0-9A-Fa-f:.]+(?: [0-9A-Fa-f:.]+)*)$'
    when: "first('devices').name_servers_vrf == vrf or not first('devices').name_servers"
    row: {table: devices, key: {}}
    set: {name_servers_vrf: "{{ vrf }}"}
    append: {name_servers: "{{ servers }}"}

  - id: sys.timezone
    match: '^clock timezone (?P<zone>\S+) (?P<sign>-)?(?P<h>\d+)(?: (?P<m>\d+))?$'
    row: {table: devices, key: {}}
    set: {timezone: "{{ zone }} {{ sign if sign else '+' }}{{ h }}{{ (':' ~ m) if (m and m != '0') else '' }}"}

  - id: sys.enable.hashed
    match: '^enable secret (?P<type>4|5|8|9) (?P<value>\S+)$'
    row: {table: devices, key: {}}
    set: {enable_secret: "{{ value }}", secret_form: hashed}

  - id: sys.enable.plain
    match: '^enable secret (?:0 )?(?P<value>\S+)$'
    row: {table: devices, key: {}}
    set: {enable_secret: "{{ value }}", secret_form: plain}

  - id: sys.snmp.location
    match: '^snmp-server location (?P<text>.+)$'
    row: {table: devices, key: {}}
    set: {snmp_location: "{{ text }}"}

  - id: sys.snmp.contact
    match: '^snmp-server contact (?P<text>.+)$'
    row: {table: devices, key: {}}
    set: {snmp_contact: "{{ text }}"}

  # A banner of each kind (appendix A 3.26): before the login, on connect,
  # after the login.
  - id: sys.banner
    match: '^banner login .*$'
    row: {table: devices, key: {}}
    set: {banner: "{{ body }}"}
  - id: sys.banner.motd
    match: '^banner motd .*$'
    row: {table: devices, key: {}}
    set: {banner_motd: "{{ body }}"}
  - id: sys.banner.exec
    match: '^banner exec .*$'
    row: {table: devices, key: {}}
    set: {banner_exec: "{{ body }}"}

  # ---- the services of the device (appendix A 3.26) ----
  # "service timestamps [debug | log] [uptime | datetime [msec]] [localtime]
  # [show-timezone] [year]". The form without "debug" / "log" stays unknown.
  - id: sys.timestamps.log
    match: '^service timestamps log (?:(?P<up>uptime)|datetime(?P<opts>(?: (?:msec|localtime|show-timezone|year))*))$'
    row: {table: devices, key: {}}
    set: {log_timestamp: "{{ 'uptime' if up else 'datetime' }}"}
    append: {log_timestamp_options: "{{ opts | replace('show-timezone', 'show_timezone') }}"}
  - id: sys.timestamps.debug
    match: '^service timestamps debug (?:(?P<up>uptime)|datetime(?P<opts>(?: (?:msec|localtime|show-timezone|year))*))$'
    row: {table: devices, key: {}}
    set: {debug_timestamp: "{{ 'uptime' if up else 'datetime' }}"}
    append: {debug_timestamp_options: "{{ opts | replace('show-timezone', 'show_timezone') }}"}
  - id: sys.password_encryption
    match: '^(?P<no>no )?service password-encryption$'
    row: {table: devices, key: {}}
    set: {password_encryption: "{{ 'false' if no else 'true' }}"}

  # The log the device keeps: "logging buffered [<bytes>] [<level>]".
  - id: sys.log_buffer
    match: '^logging buffered(?: (?P<size>\d+))?(?: (?P<level>emergencies|alerts|critical|errors|warnings|notifications|informational|debugging))?$'
    row: {table: devices, key: {}}
    set: {log_buffer: true, log_buffer_size: "{{ size }}", log_severity: "{{ level }}"}
  - id: sys.log_buffer.off
    match: '^no logging buffered$'
    row: {table: devices, key: {}}
    set: {log_buffer: false}

  # The console: only the timeout has a column; the other lines under it
  # stay unknown.
  - id: con
    match: '^line con 0$'
    row: {table: devices, key: {}}
    children:
      - id: con.timeout
        match: '^exec-timeout (?P<min>\d+)(?: (?P<sec>\d+))?$'
        set: {console_timeout: "{{ min }}", console_timeout_sec: "{{ sec if sec and sec | int != 0 else '' }}"}

  # ---- users ----
  # Level 15 is the neutral word "admin" (lexicon.yaml); other levels stay numbers.
  - id: user.secret.hashed
    match: '^username (?P<name>\S+)(?: privilege (?P<priv>\d+))? secret (?P<type>5|8|9) (?P<value>\S+)$'
    row: {table: users, key: {name: "{{ name }}"}}
    set: {privilege: "{{ (priv | unlex('user_role')) if priv == '15' else priv }}", secret: "{{ value }}", secret_form: hashed}

  - id: user.secret.plain
    match: '^username (?P<name>\S+)(?: privilege (?P<priv>\d+))? secret (?:0 )?(?P<value>\S+)$'
    row: {table: users, key: {name: "{{ name }}"}}
    set: {privilege: "{{ (priv | unlex('user_role')) if priv == '15' else priv }}", secret: "{{ value }}", secret_form: plain}

  # A user written with "password": the device keeps the password itself
  # (PPP CHAP needs it), so the row is marked reversible and is written with
  # "password" again. "password 7" is the encrypted form of the device.
  - id: user.password.encrypted
    match: '^username (?P<name>\S+)(?: privilege (?P<priv>\d+))? password 7 (?P<value>\S+)$'
    row: {table: users, key: {name: "{{ name }}"}}
    set: {privilege: "{{ (priv | unlex('user_role')) if priv == '15' else priv }}", secret: "{{ value }}", secret_form: encrypted, reversible: true}
  - id: user.password.plain
    match: '^username (?P<name>\S+)(?: privilege (?P<priv>\d+))? password (?:0 )?(?P<value>\S+)$'
    when: "value != '7'"
    row: {table: users, key: {name: "{{ name }}"}}
    set: {privilege: "{{ (priv | unlex('user_role')) if priv == '15' else priv }}", secret: "{{ value }}", secret_form: plain, reversible: true}
    # The mark of this form: on a device with an LNS such a user is a caller
    # of L2TP (import/70_l2tp.yaml).
    emit:
      - table: x_user_password
        key: {name: "{{ name }}"}
        set: {privilege: "{{ priv }}"}

  # ---- remote access ----
  - id: vty
    match: '^line vty (?P<first>\d+)(?: (?P<last>\d+))?$'
    row: {table: remote_access, key: {}}
    children:
      - id: vty.transport.all
        match: '^transport input all$'
        append: {protocols: "ssh telnet"}
      - id: vty.transport
        match: '^transport input (?P<list>(?:ssh|telnet)(?: (?:ssh|telnet))?)$'
        append: {protocols: "{{ list }}"}
      - id: vty.login_local
        match: '^login local$'
        set: {auth: local}
      - id: vty.login
        match: '^login$'
        set: {auth: password}
      - id: vty.acl
        match: '^access-class (?P<acl>\S+) in$'
        set: {acl: "{{ acl }}"}
      - id: vty.timeout
        match: '^exec-timeout (?P<min>\d+)(?: (?P<sec>\d+))?$'
        set: {idle_timeout: "{{ min }}", idle_timeout_sec: "{{ sec if sec and sec | int != 0 else '' }}"}
      # The encrypted form is kept as the device shows it: "7 <value>"
      # (appendix A 3.26).
      - id: vty.password.encrypted
        match: '^password 7 (?P<value>\S+)$'
        set: {line_password: "7 {{ value }}"}
      - id: vty.password
        match: '^password (?:0 )?(?P<value>\S+)$'
        when: "value != '7'"
        set: {line_password: "{{ value }}"}

  - id: ssh.version
    match: '^ip ssh version (?P<v>1|2)$'
    row: {table: remote_access, key: {}}
    set: {ssh_version: "{{ v }}"}

  # ---- NTP ----
  - id: ntp.server
    match: '^ntp server(?: vrf (?P<vrf>\S+))? (?P<server>\d+\.\d+\.\d+\.\d+|[0-9A-Fa-f]*:[0-9A-Fa-f:]+)(?:(?P<prefer> prefer)| source (?P<src>[A-Za-z]\S*))*$'
    row: {table: ntp_servers, key: {server: "{{ server | lower }}"}}
    set:
      vrf: "{{ vrf }}"
      prefer: "{{ 'true' if prefer else '' }}"
      source_if: "{{ src | ifname }}"

  # One line for the whole device: it is kept aside and put on each server.
  - id: ntp.source
    match: '^ntp source (?P<ifn>\S+)$'
    emit:
      - table: x_ntp
        key: {}
        set: {source_if: "{{ ifn | ifname }}"}

  # ---- syslog ----
  - id: syslog.host
    match: '^logging host (?P<server>\d+\.\d+\.\d+\.\d+)(?: vrf (?P<vrf>\S+))?$'
    row: {table: syslog_servers, key: {server: "{{ server }}"}}
    set: {vrf: "{{ vrf }}"}

  # An IPv6 destination: "logging host ipv6 <address>" (Embedded Syslog
  # Manager Command Reference; the IPv6 form has no VRF).
  - id: syslog.host6
    match: '^logging host ipv6 (?P<server>[0-9A-Fa-f]*:[0-9A-Fa-f:]+)$'
    row: {table: syslog_servers, key: {server: "{{ server | lower }}"}}

  - id: syslog.host.short
    match: '^logging (?P<server>\d+\.\d+\.\d+\.\d+)$'
    row: {table: syslog_servers, key: {server: "{{ server }}"}}

  - id: syslog.facility
    match: '^logging facility (?P<f>\S+)$'
    emit:
      - table: x_logging
        key: {}
        set: {facility: "{{ f }}"}

  - id: syslog.trap
    match: '^logging trap (?P<level>emergencies|alerts|critical|errors|warnings|notifications|informational|debugging)$'
    emit:
      - table: x_logging
        key: {}
        set: {severity: "{{ level }}"}

  - id: syslog.source
    match: '^logging source-interface (?P<ifn>\S+)$'
    emit:
      - table: x_logging
        key: {}
        set: {source_if: "{{ ifn | ifname }}"}

  # ---- SNMP ----
  # "ro" / "rw" may be shown in capitals; both are read.
  - id: snmp.community
    match: '^snmp-server community (?P<name>\S+)(?: (?P<access>(?i:ro|rw)))?(?: (?P<acl>\S+))?$'
    row: {table: snmp_communities, key: {community: "{{ name }}"}}
    set: {access: "{{ access | lower }}", acl: "{{ acl }}"}

  - id: snmp.host
    match: '^snmp-server host (?P<host>\d+\.\d+\.\d+\.\d+|[0-9A-Fa-f]*:[0-9A-Fa-f:]+)(?: version (?P<ver>1|2c))? (?P<community>\S+)$'
    when: "community not in ['traps', 'informs', 'version', 'vrf']"
    row: {table: snmp_hosts, key: {host: "{{ host }}"}}
    set: {version: "{{ ver }}", community: "{{ community }}"}

  - id: snmp.trap_source
    match: '^snmp-server trap-source (?P<ifn>\S+)$'
    emit:
      - table: x_snmp
        key: {}
        set: {source_if: "{{ ifn | ifname }}"}

derive:
  - id: ntp.source.each
    for: ntp_servers
    as: s
    let:
      g: "lookup('x_ntp')"
    when: "g.source_if and not s.source_if"
    row: {table: ntp_servers, key: {server: "{{ s.server }}"}}
    set: {source_if: "{{ g.source_if }}"}

  - id: syslog.common
    for: syslog_servers
    as: s
    let:
      g: "lookup('x_logging')"
    when: "g"
    row: {table: syslog_servers, key: {server: "{{ s.server }}"}}
    set:
      facility: "{{ g.facility }}"
      severity: "{{ g.severity }}"
      source_if: "{{ g.source_if }}"

  - id: snmp.trap_source.each
    for: snmp_hosts
    as: h
    let:
      g: "lookup('x_snmp')"
    when: "g.source_if"
    row: {table: snmp_hosts, key: {host: "{{ h.host }}"}}
    set: {source_if: "{{ g.source_if }}"}
