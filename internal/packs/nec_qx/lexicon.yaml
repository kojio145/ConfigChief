# Neutral word: the word of the device (appendix A 1.4, appendix B 4.2).
# Source: the command manuals named in the README.
# The two predefined roles that have a neutral word. Other roles (level-0 to
# level-15, roles made on the device) are written by their own name.
user_role:
  admin: network-admin
  operator: network-operator

# "stp mode": the device's "pvst" runs RSTP in every VLAN (Operation Manual,
# "PVST の動作"), which is what the dataset calls rapid_pvst.
stp_mode:
  rapid_pvst: pvst
  mst: mstp
  rstp: rstp
  stp: stp

ospf_network:
  broadcast: broadcast
  nbma: nbma
  point_to_multipoint: p2mp
  point_to_point: p2p

snmp_access:
  ro: read
  rw: write

snmp_version:
  "1": v1
  2c: v2c

# "privacy-mode" of an SNMPv3 user.
snmp_priv:
  des: des56
  3des: 3des
  aes128: aes128

# The keywords of the log levels (Information center commands, the table of
# the log levels).
severity:
  emergencies: emergency
  alerts: alert
  critical: critical
  errors: error
  warnings: warning
  notifications: notification
  informational: informational
  debugging: debugging

acl_type:
  standard: basic
  extended: advanced

# The protocols an advanced rule names by a word ("rule (IPv4 advanced ACL
# view)"). ESP and AH have no word and go by their numbers.
acl_protocol:
  ip: ip
  tcp: tcp
  udp: udp
  icmp: icmp
  gre: gre
  ospf: ospf
  esp: "50"
  ah: "51"

