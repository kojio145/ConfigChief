# A switch of the generation before Version 7 (made-up values): user-interface, levels, passwords the device saved (cipher), VRRP times in seconds.
tables:
  acl_entries:
    - {acl: "2000", seq: "0", action: "permit", src: "192.0.2.0/25"}
  acls:
    - {name: "2000", type: "standard"}
  devices:
    - {hostname: "sw-q07", console_timeout: "5", debug_timestamp: "datetime", enable_secret: "$c$3$sampleSampleSampleSampleSample", log_timestamp: "uptime", os_version: "5.1.1", secret_form: "encrypted", vendor: "nec_qx"}
  fhrp:
    - {if_name: "Vlan-interface10", group: "1", advert_interval: "5", auth_key: "Example-Vrrp-5", auth_type: "simple", preempt: "true", preempt_delay: "10", priority: "100", protocol: "vrrp", version: "3", virtual_ip: "192.0.2.126"}
    - {if_name: "Vlan-interface10", group: "2", advert_interval: "1", auth_key: "cipher $c$3$sampleSampleSampleSample", auth_type: "md5", preempt: "true", priority: "100", protocol: "vrrp", version: "3", virtual_ip: "192.0.2.125"}
  interfaces:
    - {name: "Vlan-interface10", enabled: "true", ipv4: "192.0.2.1/25", kind: "vlan", vlan_id: "10"}
    - {name: "Ethernet1/0/1", enabled: "true", kind: "physical"}
    - {name: "Ethernet1/0/2", enabled: "true", kind: "physical"}
    - {name: "GigabitEthernet1/0/25", enabled: "true", kind: "physical"}
  l2_settings:
    - {stp_enabled: "true"}
  ntp_servers:
    - {server: "192.0.2.10", source_if: "Vlan-interface10"}
  ospf_interfaces:
    - {process_id: "1", if_name: "Vlan-interface10", area: "0.0.0.0", auth_key: "cipher $c$3$dummyDummyDummyDummyDummy", auth_key_id: "1", auth_type: "md5"}
  ospf_processes:
    - {process_id: "1"}
  remote_access:
    - {auth: "local", line_password: "cipher $c$3$sampleSampleSampleSampleSampleSample", protocols: ["telnet"]}
  snmp_communities:
    - {community: "example-ro5", access: "ro", acl: "2000"}
  switchports:
    - {if_name: "Ethernet1/0/1", access_vlan: "10", mode: "access", stp_edge: "on", voice_vlan: "10"}
    - {if_name: "Ethernet1/0/2", mode: "access"}
    - {if_name: "GigabitEthernet1/0/25", allowed_vlans: ["all"], mode: "trunk"}
  syslog_servers:
    - {server: "192.0.2.21", facility: "local5"}
  users:
    - {name: "admin", privilege: "admin", secret: "$c$3$dummyDummyDummyDummyDummyDummy", secret_form: "encrypted", services: ["ssh", "telnet", "terminal"]}
    - {name: "monitor", privilege: "1", secret: "Example-Secret-5", secret_form: "plain", services: ["telnet"]}
  vlans:
    - {vlan_id: "1"}
    - {vlan_id: "10"}
unknown:
  - "super password level 2 simple Example-Super-2"
  - "info-center loghost 192.0.2.20 channel loghost facility local5"
  - "acl number 3000 name sample-old"
  - "rule 0 permit ip"
  - "user privilege level 3"
