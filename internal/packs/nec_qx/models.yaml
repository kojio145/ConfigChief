# The shapes of the switches of the series (appendix B 6). The IDs name the
# ports, not a product: "qx-24ge-4xge" has 24 Gigabit Ethernet ports and 4
# ports of 10 Gigabit Ethernet. The names of the ports: README, "機種の定義".
models:
  - id: qx-24ge-4xge
    title: {ja: "GE×24 ＋ 10GE×4", en: "24 GE ports and 4 10GE ports"}
    ports:
      - {range: "GigabitEthernet1/0/[1-24]", role: switch}
      - {range: "Ten-GigabitEthernet1/0/[25-28]", role: switch}
    logical: {loopback: "LoopBack{n}", vlan: "Vlan-interface{vlan}", lag: "Bridge-Aggregation{n}"}
  - id: qx-48ge-4xge
    title: {ja: "GE×48 ＋ 10GE×4", en: "48 GE ports and 4 10GE ports"}
    ports:
      - {range: "GigabitEthernet1/0/[1-48]", role: switch}
      - {range: "Ten-GigabitEthernet1/0/[49-52]", role: switch}
    logical: {loopback: "LoopBack{n}", vlan: "Vlan-interface{vlan}", lag: "Bridge-Aggregation{n}"}
